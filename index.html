
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMK VIDEO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101018;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #191925;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 28px;
  color: #00e5ff;
  font-weight: bold;
}

nav {
  display: flex;
  justify-content: space-around;
  padding: 15px;
  background: #222;
}

nav a {
  color: white;
  text-decoration: none;
}

h2 {
  padding: 15px;
}

.card {
  background: #252535;
  margin: 15px;
  padding: 15px;
  border-radius: 12px;
}

iframe {
  width: 100%;
  height: 220px;
  border: 0;
  border-radius: 10px;
}

button {
  background: #00c8ff;
  padding: 12px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

input {
  display: block;
  width: calc(100% - 30px);
  margin: 10px 15px;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #555;
}

#message {
  padding: 10px 15px;
  color: #00e5ff;
}

.delete-btn {
  background: #ff3333;
  color: white;
  margin-top: 10px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">TMK VIDEO</div>
  <div>🎬</div>
</header>

<nav>
  <a href="#home">Home</a>
  <a href="#videos">Videos</a>
  <a href="#account">Account</a>
  <a href="#about">About</a>
</nav>

<section id="home">
  <h2>Welcome to TMK VIDEO</h2>
  <div class="card">
    <h3>Watch Videos</h3>
    <p>Enjoy your favorite videos!</p>
  </div>
</section>

<section id="videos">
  <h2>Latest Videos</h2>

  <div class="card">
    <h3>PUBG MOBILE</h3>
    <p>Gaming Videos</p>
    <iframe
      src="https://www.youtube.com/embed/xs0xcwDQ0WQ"
      title="PUBG MOBILE"
      allowfullscreen>
    </iframe>
  </div>

  <div class="card">
    <h3>GODOT GAME</h3>
    <p>Game Development</p>
  </div>

  <div id="videoList"></div>
</section>

<section id="account">
  <h2>TMK VIDEO Account</h2>

  <input id="email" type="email" placeholder="Email">

  <input id="password" type="password" placeholder="Password">

  <button id="registerBtn">Register</button>
  <button id="loginBtn">Login</button>
  <button id="logoutBtn" style="background:#ff4444;color:white;display:none;">
    Logout
  </button>

  <p id="message">Not logged in</p>
</section>

<section id="addVideo">
  <h2>TMK VIDEO - Add Video</h2>

  <input
    type="text"
    id="videoTitle"
    placeholder="ဗီဒီယိုအမည် ရေးပါ">

  <input
    type="text"
    id="videoLink"
    placeholder="YouTube Video Link ထည့်ပါ">

  <button id="addVideoBtn">Add Video</button>
</section>

<section id="about">
  <h2>About TMK</h2>
  <p>Welcome to TMK Official Website.</p>
</section>

<footer>
  © 2026 TMK VIDEO
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

// Firebase Configuration

const firebaseConfig = {
  apiKey: "AIzaSyAQxjXOcFEBRv-yrFsxU1Z7tSLjT74UC_M",
  authDomain: "tmk-video.firebaseapp.com",
  databaseURL: "https://tmk-video-default-rtdb.firebaseio.com",
  projectId: "tmk-video",
  storageBucket: "tmk-video.firebasestorage.app",
  messagingSenderId: "763253894514",
  appId: "1:763253894514:web:5b671edd58fe2d312381eb",
  measurementId: "G-NZXE0Y822B"
};

// Initialize Firebase

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

const message = document.getElementById("message");
const videoList = document.getElementById("videoList");

const videosRef = ref(database, "videos");

let savedVideos = [];

// Register

document.getElementById("registerBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    message.textContent = "Register successful!";
  } catch (error) {
    message.textContent = error.message;
  }

});

// Login

document.getElementById("loginBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    message.textContent = "Login successful!";
  } catch (error) {
    message.textContent = error.message;
  }

});

// Logout

document.getElementById("logoutBtn").addEventListener("click", async () => {

  try {
    await signOut(auth);
    message.textContent = "Logout successful!";
  } catch (error) {
    message.textContent = error.message;
  }

});

// Render Videos

function renderVideos() {

  videoList.innerHTML = "";

  savedVideos.forEach((video) => {

    const item = document.createElement("div");
    item.className = "card";

    const heading = document.createElement("h3");
    heading.textContent = video.title || "Untitled Video";

    const player = document.createElement("iframe");
    player.src = "https://www.youtube.com/embed/" + video.youtubeId;
    player.allowFullscreen = true;

    item.append(heading, player);

    if (auth.currentUser && auth.currentUser.uid === video.uid) {

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "Delete Video";
      deleteBtn.className = "delete-btn";

      deleteBtn.addEventListener("click", async () => {

        if (!confirm("ဒီ Video ကို ဖျက်မှာ သေချာပါသလား။")) {
          return;
        }

        try {
          await remove(ref(database, "videos/" + video.id));
          alert("Video ဖျက်ပြီးပါပြီ!");
        } catch (error) {
          alert("ဖျက်မရပါ: " + error.message);
        }

      });

      item.appendChild(deleteBtn);
    }

    videoList.appendChild(item);

  });

}

// Load Videos from Firebase

onValue(videosRef, (snapshot) => {

  savedVideos = [];

  snapshot.forEach((childSnapshot) => {

    savedVideos.push({
      id: childSnapshot.key,
      ...childSnapshot.val()
    });

  });

  savedVideos.reverse();

  renderVideos();

}, (error) => {
  message.textContent = "Video loading error: " + error.message;
});

// Authentication State

onAuthStateChanged(auth, (user) => {

  if (user) {

    message.textContent = "Logged in as: " + user.email;

    document.getElementById("logoutBtn").style.display = "inline-block";

  } else {

    message.textContent = "Not logged in";

    document.getElementById("logoutBtn").style.display = "none";

  }

  renderVideos();

});

// Add Video

document.getElementById("addVideoBtn").addEventListener("click", async () => {

  const title = document.getElementById("videoTitle").value.trim();
  const link = document.getElementById("videoLink").value.trim();

  let videoId = "";

  try {

    const url = new URL(link);

    if (url.hostname === "youtu.be") {

      videoId = url.pathname.slice(1);

    } else if (
      url.hostname.includes("youtube.com") ||
      url.hostname.includes("youtube-nocookie.com")
    ) {

      videoId =
        url.searchParams.get("v") ||
        url.pathname.split("/").filter(Boolean).pop();

    }

  } catch (error) {}

  if (!title || !/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {

    alert("ဗီဒီယိုအမည်နဲ့ YouTube Link မှန်မှန်ထည့်ပါ။");
    return;

  }

  if (!auth.currentUser) {

    alert("Video ထည့်ရန် Login ဝင်ထားပါ။");
    return;

  }

  try {

    await push(videosRef, {

      title: title,
      youtubeId: videoId,
      uid: auth.currentUser.uid,
      createdAt: Date.now()

    });

    document.getElementById("videoTitle").value = "";
    document.getElementById("videoLink").value = "";

    alert("Video saved successfully!");

  } catch (error) {

    alert("Video သိမ်းမရပါ: " + error.message);

  }

});

console.log("TMK VIDEO Firebase Connected!");

</script>

</body>
</html>
