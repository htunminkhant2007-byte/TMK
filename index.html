<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMK VIDEO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101018;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #191925;
  padding: 18px;
  display: flex;
  justify-content: space-between;
}

.logo {
  font-size: 28px;
  color: #00e5ff;
  font-weight: bold;
}

nav {
  display: flex;
  justify-content: space-around;
  padding: 15px;
  background: #222;
}

nav a {
  color: white;
  text-decoration: none;
}

h2 {
  padding: 15px;
}

.card {
  background: #252535;
  margin: 15px;
  padding: 15px;
  border-radius: 12px;
}

iframe {
  width: 100%;
  height: 220px;
  border: 0;
  border-radius: 10px;
}

button {
  background: #00c8ff;
  padding: 12px;
  border: 0;
  border-radius: 8px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">TMK VIDEO</div>
  <div>🎬</div>
</header>

<nav>
  <a href="#home">Home</a>
  <a href="#videos">Videos</a>
  <a href="#about">About</a>
</nav>

<section id="home">
  <h2>Welcome to TMK VIDEO</h2>
  <div class="card">
    <h3>Watch Videos</h3>
    <p>Enjoy your favorite videos!</p>
  </div>
</section>

<section id="videos">
  <h2>Latest Videos</h2>

  <div class="card">
    <h3>PUBG MOBILE</h3>
    <p>Gaming Videos</p>
    <iframe
  width="100%"
  height="250"
  src="https://www.youtube.com/embed/xs0xcwDQ0WQ"
  title="PUBG MOBILE"
  frameborder="0"
  allowfullscreen>
</iframe>
</div>
 <div class="card">
    <h3>GODOT GAME</h3>
    <p>Game Development</p>
  </div>
</section>

<section id="about">
  <h2>About TMK</h2>
  <p>Welcome to TMK Official Website.</p>
</section>

<footer>
  © 2026 TMK VIDEO
</footer>

<section id="account">
  <h2>TMK VIDEO Account</h2>

  <input id="email" type="email" placeholder="Email">

  <input id="password" type="password" placeholder="Password">

  <button id="registerBtn">Register</button>

  <button id="loginBtn">Login</button>

  <p id="message"></p>
</section>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getDatabase,
  ref,
  push,
  onValue
remove
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQxjXOcFEBRv-yrFsxU1Z7tSLjT74UC_M",
  authDomain: "tmk-video.firebaseapp.com",
  databaseURL: "https://tmk-video-default-rtdb.firebaseio.com",
  projectId: "tmk-video",
  storageBucket: "tmk-video.firebasestorage.app",
  messagingSenderId: "763253894514",
  appId: "1:763253894514:web:5b671edd58fe2d312381eb",
  measurementId: "G-NZXE0Y822B"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

window.tmkFirebase = { app, auth, database };

document.getElementById("registerBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    message.textContent = "Register successful!";
  } catch (error) {
    message.textContent = error.message;
  }
});

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  try {
    await signInWithEmailAndPassword(auth, email, password);
    message.textContent = "Login successful!";
  } catch (error) {
    message.textContent = error.message;
  }
});
const logoutBtn = document.createElement("button");
logoutBtn.textContent = "Logout";
logoutBtn.style.background = "#ff4444";
logoutBtn.style.color = "white";
logoutBtn.style.padding = "12px";
logoutBtn.style.margin = "10px";
logoutBtn.style.border = "none";
logoutBtn.style.borderRadius = "8px";

document.getElementById("message").after(logoutBtn);

logoutBtn.addEventListener("click", async () => {
  try {
    await signOut(auth);
    document.getElementById("message").textContent = "Logout successful!";
  } catch (error) {
    document.getElementById("message").textContent = error.message;
  }
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("message").textContent =
      "Logged in as: " + user.email;
  } else {
    document.getElementById("message").textContent = "Not logged in";
  }
});


      
const videoList = document.getElementById("videoList");
const videosRef = ref(database, "videos");

// Database ထဲက Video တွေကို ပြသမယ်
onValue(videosRef, (snapshot) => {
  videoList.innerHTML = "";

  const videos = [];

  snapshot.forEach((childSnapshot) => {
    videos.push(childSnapshot.val());
  });

  videos.reverse().forEach((video) => {
    const item = document.createElement("div");
    const heading = document.createElement("h3");
    heading.textContent = video.title;

    const player = document.createElement("iframe");
    player.src = "https://www.youtube.com/embed/" + video.youtubeId;
    player.width = "100%";
    player.height = "250";
    player.allowFullscreen = true;

    item.append(heading, player);
    videoList.appendChild(item);
  });
});

// Video အသစ် Database ထဲ သိမ်းမယ်
document.getElementById("addVideoBtn").addEventListener("click", async () => {
  const title = document.getElementById("videoTitle").value.trim();
  const link = document.getElementById("videoLink").value.trim();

  let videoId = "";

  try {
    const url = new URL(link);

    if (url.hostname === "youtu.be") {
      videoId = url.pathname.slice(1);
    } else if (
      url.hostname.includes("youtube.com") ||
      url.hostname.includes("youtube-nocookie.com")
    ) {
      videoId =
        url.searchParams.get("v") ||
        url.pathname.split("/").filter(Boolean).pop();
    }
  } catch (error) {}

  if (!title || !/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
    alert("ဗီဒီယိုအမည်နဲ့ YouTube Link မှန်မှန်ထည့်ပါ။");
    return;
  }

  if (!auth.currentUser) {
    alert("Video ထည့်ရန် Login ဝင်ထားပါ။");
    return;
  }

  try {
    await push(videosRef, {
      title: title,
      youtubeId: videoId,
      uid: auth.currentUser.uid,
      createdAt: Date.now()
    });

    document.getElementById("videoTitle").value = "";
    document.getElementById("videoLink").value = "";

    alert("Video saved successfully!");
  } catch (error) {
    alert("Video သိမ်းမရပါ: " + error.message);
  }
});
console.log("TMK VIDEO Firebase Connected!");
</script>

<h2>TMK VIDEO - Add Video</h2>

<input
  type="text"
  id="videoTitle"
  placeholder="ဗီဒီယိုအမည် ရေးပါ"
>

<input
  type="text"
  id="videoLink"
  placeholder="YouTube Video Link ထည့်ပါ"
>

<button id="addVideoBtn">Add Video</button>

<div id="videoList"></div>
</body>
</html>
