
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#090910">
<title>TMK VIDEO</title>
<style>
:root{--bg:#090910;--panel:#191923;--cyan:#28e0c0;--pink:#ff315b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:white;font-family:Arial,sans-serif}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}
.topbar{position:fixed;top:0;left:0;right:0;height:55px;z-index:30;display:flex;justify-content:center;align-items:center;background:#090910bb}
.tabs{display:flex;gap:18px}
.tabs button{background:none;color:#aaa;padding:9px 0}
.tabs button.active{color:var(--cyan);border-bottom:2px solid var(--cyan)}
.page{display:none;position:absolute;inset:0;background:var(--bg)}
.page.active{display:block}
#homePage{overflow:hidden}
#feed{
 position:absolute;inset:0;width:100%;height:100%;
 display:flex;flex-direction:column;
 overflow-y:auto;overflow-x:hidden;
 -webkit-overflow-scrolling:touch;
 overscroll-behavior-y:contain;
 scroll-snap-type:y mandatory;
 scrollbar-width:none;touch-action:pan-y;
}
#feed::-webkit-scrollbar{display:none}
.video-card{
 position:relative;flex:0 0 100%;
 width:100%;height:100%;min-height:100%;
 background:#000;overflow:hidden;
 scroll-snap-align:start;scroll-snap-stop:always;
}
.video-media{position:absolute;inset:0}
.video-media video,.video-media iframe{
 width:100%;height:100%;border:0;object-fit:contain;background:#000
}
.video-media:after{
 content:"";position:absolute;inset:35% 0 0;
 background:linear-gradient(transparent,#0009);pointer-events:none
}
.video-info{position:absolute;left:13px;right:75px;bottom:85px;z-index:5;text-shadow:0 1px 4px #000}
.video-info p{font-size:14px;overflow-wrap:anywhere}
.actions{position:absolute;right:8px;bottom:100px;z-index:8;display:flex;flex-direction:column;align-items:center;gap:8px;width:55px}
.actions button{width:45px;height:45px;border-radius:50%;background:#222b;color:white;font-size:23px}
.actions small{font-size:11px}
.liked{color:var(--pink)!important}
.saved{color:var(--cyan)!important}
.play-button{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9;background:#0009;color:white;border:2px solid white;border-radius:50%;width:65px;height:65px;font-size:30px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:65px;z-index:50;background:#101019;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #292938}
.bottom-nav button{flex:1;height:100%;background:none;color:#aaa;font-size:12px}
.bottom-nav button.active{color:var(--cyan)}
.other-page{padding:70px 14px 90px;overflow:auto}
.card{background:var(--panel);border:1px solid #303040;border-radius:14px;padding:14px;margin-bottom:14px}
input,textarea{display:block;width:100%;padding:12px;margin:8px 0;background:#242432;color:white;border:1px solid #444;border-radius:10px}
textarea{min-height:70px}
.btn{padding:11px 14px;border-radius:9px;background:#333345;color:white;margin:4px}
.primary{background:var(--cyan);color:#06120f;font-weight:bold}
.danger{background:#c83752;color:white}
.status{color:var(--cyan);font-size:13px}
.progress{height:9px;background:#333;border-radius:20px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--cyan)}
.comment-panel{display:none;position:fixed;z-index:80;bottom:65px;left:0;right:0;max-height:70vh;overflow:auto;background:#191923;padding:15px;border-radius:18px 18px 0 0}
.comment-panel.open{display:block}
.comment-item{background:#30303c;padding:10px;border-radius:9px;margin:7px 0}
@media(min-width:700px){
 #feed{max-width:440px;left:50%;transform:translateX(-50%)}
 .other-page{max-width:650px;margin:auto}
}
</style>

<nav class="bottom-nav">

function esc(s=""){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));

function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));

 document.querySelectorAll("[data-page]").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===id);

function clearEngagement(){

function loadVideos(){

   snap.forEach(child=>{

  allVideos.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  renderFeed(allVideos);
  updateProfileCount();

}
loadVideos();

function renderFeed(inputVideos){

function setupVideoButtons(){
 document.querySelectorAll("#feed [data-play]").forEach(b=>{
  const v=b.closest(".video-card").querySelector("video");
  b.onclick=e=>{
   e.stopPropagation();
   v.play().catch(()=>{});
  };
  v.addEventListener("click",()=>{
   if(v.paused)v.play().catch(()=>{});
   else v.pause();
  });
  v.addEventListener("play",()=>b.classList.add("hidden"));
  v.addEventListener("pause",()=>b.classList.remove("hidden"));
 });

 document.querySelectorAll("#feed [data-like]").forEach(b=>{
  b.onclick=()=>likeVideo(b.dataset.like);
 });

 document.querySelectorAll("#feed [data-follow]").forEach(b=>{

 });
 document.querySelectorAll("#feed [data-save]").forEach(b=>{

 });
 document.querySelectorAll("#feed [data-share]").forEach(b=>{
  b.onclick=()=>shareVideo(b.dataset.share);
 });
 document.querySelectorAll("#feed [data-delete]").forEach(b=>{
  b.onclick=()=>deleteVideo(b.dataset.delete);
 });
}

function setupAutoplay(){
 if(feedObserver)feedObserver.disconnect();
 if(!("IntersectionObserver"in window))return;
 feedObserver=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
   const video=entry.target;
   if(entry.isIntersecting&&entry.intersectionRatio>=.65){
    document.querySelectorAll("#feed video").forEach(other=>{
     if(other!==video){other.pause();other.muted=true;}
    });
    video.muted=true;
    video.play().catch(()=>{});
   }else video.pause();
  });
 },{threshold:[0,.65,.9]});
 document.querySelectorAll("#feed video[data-feed-video]").forEach(v=>feedObserver.observe(v));
}

function watchEngagement(id){
 const stopLikes=onValue(ref(db,"likes/"+id),snap=>{
  const data=snap.val()||{};
  const count=Object.values(data).filter(x=>x===true).length;
  const card=document.querySelector(`[data-card="${CSS.escape(id)}"]`);
  if(!card)return;
  const button=card.querySelector("[data-like]");
  const number=card.querySelector("[data-like-count]");
  const liked=!!(currentUser&&data[currentUser.uid]===true);
  button.textContent=liked?"♥":"♡";
  button.classList.toggle("liked",liked);
  number.textContent=count;
 });
 const stopComments=onValue(ref(db,"comments/"+id),snap=>{
  let count=0;
  if(snap.exists())snap.forEach(()=>count++);
  const n=document.querySelector(`[data-card="${CSS.escape(id)}"] [data-comment-count]`);
  if(n)n.textContent=count;
 });
 engagementUnsubscribers.push(stopLikes,stopComments);
}

async function likeVideo(id){
 if(!currentUser)return alert("Login အရင်ဝင်ပါ");
 const r=ref(db,"likes/"+id+"/"+currentUser.uid);
 const s=await get(r);
 if(s.exists()&&s.val()===true)await remove(r);
 else await set(r,true);
}

async function followUser(uid){
 if(!currentUser)return alert("Login အရင်ဝင်ပါ");
 if(!uid||uid===currentUser.uid)return;
 const r=ref(db,"follows/"+uid+"/"+currentUser.uid);
 if(followingIds.has(uid)){
  await remove(r);followingIds.delete(uid);
 }else{
  await set(r,true);followingIds.add(uid);
 }
 if(feedMode==="following")renderFeed(allVideos);
}

async function saveVideo(id){
 if(!currentUser)return alert("Login အရင်ဝင်ပါ");
 const r=ref(db,"savedVideos/"+currentUser.uid+"/"+id);
 if(savedVideoIds.has(id)){
  await remove(r);savedVideoIds.delete(id);
 }else{
  await set(r,true);savedVideoIds.add(id);
 }
 renderFeed(allVideos);

/* UPLOAD PERMISSION */
async function getUploadPermission(file){
 if(!currentUser)throw Error("Login အရင်ဝင်ပါ");
 const token=await currentUser.getIdToken();
 const response=await fetch(UPLOAD_FUNCTION_URL,{
  method:"POST",
  headers:{
   Authorization:"Bearer "+token,
   apikey:SUPABASE_PUBLISHABLE_KEY,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({
   filename:file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),
   contentType:file.type
  })
 });
 const result=await response.json();
 if(!response.ok||!result.success)throw Error(result.error||"Upload Permission Error");
 return result;
}

function uploadWithProgress(url,file){
 return new Promise((resolve,reject)=>{
  const xhr=new XMLHttpRequest();
  xhr.open("PUT",url);
  xhr.setRequestHeader("Content-Type",file.type||"application/octet-stream");
  xhr.upload.onprogress=e=>{
   if(e.lengthComputable){
    const pct=Math.round(e.loaded/e.total*100);
    $("fileProgressBar").style.width=pct+"%";
    $("fileStatus").textContent="Uploading "+pct+"%";
   }
  };
  xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(Error("Storage Error "+xhr.status+": "+xhr.responseText));
  xhr.onerror=()=>reject(Error("Network Error"));
  xhr.send(file);
 });
}

async function workerPost(path,body){
 const token=await currentUser.getIdToken();
 const response=await fetch(WORKER_URL+path,{
  method:"POST",
  headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},
  body:JSON.stringify(body)
 });
 const result=await response.json();
 if(!response.ok||!result.success)throw Error(result.message||result.error||"Worker API Error");
 return result;
}
async function sha1Hex(blob){
 const hash=await crypto.subtle.digest("SHA-1",await blob.arrayBuffer());
 return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function uploadB2Part(url,token,number,sha1,blob,onProgress){
 return new Promise((resolve,reject)=>{
  const xhr=new XMLHttpRequest();
  xhr.open("POST",url);
  xhr.setRequestHeader("Authorization",token);
  xhr.setRequestHeader("X-Bz-Part-Number",String(number));
  xhr.setRequestHeader("X-Bz-Content-Sha1",sha1);
  xhr.setRequestHeader("Content-Type","application/octet-stream");
  xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded);};
  xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(Error("B2 Part Error "+xhr.status+": "+xhr.responseText));
  xhr.onerror=()=>reject(Error("B2 Network Error"));
  xhr.send(blob);
 });
}
async function uploadLargeVideoToB2(file,title,caption){
 $("fileStatus").textContent="B2 Upload စတင်နေပါတယ်...";
 const init=await workerPost("/upload/init",{size:file.size,contentType:file.type});
 const partSha1Array=[];
 let uploaded=0;

 for(let i=0;i<init.partCount;i++){
  const number=i+1;
  const chunk=file.slice(i*init.partSize,Math.min((i+1)*init.partSize,file.size));
  $("fileStatus").textContent="Part "+number+"/"+init.partCount;
  const sha1=await sha1Hex(chunk);
  const part=await workerPost("/upload/part-url",{fileId:init.fileId,partNumber:number});
  await uploadB2Part(part.uploadUrl,part.authorizationToken,number,sha1,chunk,loaded=>{
   $("fileProgressBar").style.width=Math.round(Math.min(uploaded+loaded,file.size)/file.size*100)+"%";
  });
  uploaded+=chunk.size;
  partSha1Array.push(sha1);
 }
 const finished=await workerPost("/upload/finish",{fileId:init.fileId,partSha1Array});
 await push(ref(db,"videos"),{
  title:(title||file.name).slice(0,100),
  caption:(caption||"").slice(0,500),
  videoUrl:finished.videoUrl,
  storagePath:finished.fileName,
  storageProvider:"Backblaze B2",
  uid:currentUser.uid,
  username:$("profileName").textContent||"User",
  createdAt:Date.now()
 });
 $("fileProgressBar").style.width="100%";
 $("fileStatus").textContent="Upload Complete!";
}

async function uploadVideoFile(file,title,caption){
 if(!currentUser)throw Error("Login အရင်ဝင်ပါ");
 if(!file)throw Error("Video ရွေးပါ");
 if(!["video/mp4","video/webm","video/quicktime"].includes(file.type))throw Error("MP4, WebM, MOV သာတင်နိုင်ပါတယ်");
 $("fileProgressBar").style.width="0%";

 if(file.size>50*1024*1024){
  return uploadLargeVideoToB2(file,title,caption);
 }

 $("fileStatus").textContent="Supabase Permission တောင်းနေပါတယ်...";
 const p=await getUploadPermission(file);
 if(!p.path||!p.token||!p.publicUrl)throw Error("Supabase Upload Permission မပြည့်စုံပါ");

 const path=p.path.split("/").map(encodeURIComponent).join("/");
 const url=SUPABASE_URL+"/storage/v1/object/upload/sign/"+
  encodeURIComponent(BUCKET_NAME)+"/"+path+
  "?token="+encodeURIComponent(p.token);
 await uploadWithProgress(url,file);

 await push(ref(db,"videos"),{
  title:(title||file.name).slice(0,100),
  caption:(caption||"").slice(0,500),
  videoUrl:p.publicUrl,
  storagePath:p.path,
  storageProvider:"Supabase",
  uid:currentUser.uid,
  username:$("profileName").textContent||"User",
  createdAt:Date.now()
 });
 $("fileProgressBar").style.width="100%";
 $("fileStatus").textContent="Upload Complete!";
}

/* CAMERA AND FACE TRACKING */
const camera=$("tmkCamera");
const preview=$("tmkPreview");
const cameraScreen=$("tmkCameraScreen");

let currentEffect="none";
let torchOn=false;
let cameraZoom=1;
let currentSticker="";
let faceDetector=null;
let faceTracking=false;
let faceLoopId=0;
let lastFaceDetect=0;
let trackedFace=null;
let faceDetectorLoading=false;

function setCameraStatus(message){
 $("cameraStatus").textContent=message;
 $("cameraLiveStatus").textContent=message;
}

/* LOAD MEDIAPIPE FACE DETECTOR */
async function loadFaceDetector(){
 if(faceDetector)return faceDetector;
 if(faceDetectorLoading)throw Error("Face tracking စတင်နေပါသည်");

 faceDetectorLoading=true;

 try{
  const vision=await FilesetResolver.forVisionTasks(
   "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  faceDetector=await FaceDetector.createFromOptions(vision,{
   baseOptions:{
    modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
    delegate:"CPU"
   },
   runningMode:"VIDEO",
   minDetectionConfidence:0.55
  });

  return faceDetector;
 }finally{faceDetectorLoading=false;}
}

/* STICKER POSITION — FACE TRACKING */
function positionTrackedSticker(){
 const el=$("tmkStickerOverlay");

 if(!faceTracking||!trackedFace||!currentSticker||!camera.videoWidth){
  el.style.display="none";
  return;
 }

 const box=trackedFace;
 const vw=camera.videoWidth;
 const vh=camera.videoHeight;
 const rect=camera.getBoundingClientRect();

 const scale=Math.max(rect.width/vw,rect.height/vh);
 const cropX=(vw*scale-rect.width)/2;
 const cropY=(vh*scale-rect.height)/2;

 let cx=(box.originX+box.width/2)*scale-cropX;
 let cy=(box.originY+box.height*.12)*scale-cropY;

 if(facing==="user")cx=rect.width-cx;

 cx=(cx-rect.width/2)*cameraZoom+rect.width/2;
 cy=(cy-rect.height/2)*cameraZoom+rect.height/2;

 const size=Math.max(34,Math.min(112,box.width*scale*.75));

 el.style.position="absolute";
 el.style.display="block";
 el.style.left=cx+"px";
 el.style.top=cy+"px";
 el.style.right="auto";
 el.style.width="auto";
 el.style.transform="translate(-50%,-50%)";
 el.style.fontSize=size+"px";
 el.textContent=currentSticker;
}

/* FACE TRACKING LOOP */
function faceTrackingLoop(){
 if(!faceTracking||!cameraStream)return;

 const now=performance.now();

 if(now-lastFaceDetect>90&&camera.readyState>=2&&faceDetector){
  lastFaceDetect=now;

  try{
   const result=faceDetector.detectForVideo(camera,now);
   trackedFace=result.detections?.[0]?.boundingBox||null;
   positionTrackedSticker();
  }catch(e){console.warn("Face detection:",e);}
 }

 faceLoopId=requestAnimationFrame(faceTrackingLoop);
}

/* FACE TRACK BUTTON */
$("tmkFaceTrack").onclick=async()=>{
 if(faceTracking){
  faceTracking=false;
  cancelAnimationFrame(faceLoopId);
  trackedFace=null;

  $("tmkFaceTrack").classList.remove("active");
  $("tmkFaceTrack").textContent="🎯 Face Track: OFF";

  const el=$("tmkStickerOverlay");
  el.style.display=currentSticker?"block":"none";
  el.style.left="50%";
  el.style.top="24%";
  el.style.right="auto";
  el.style.transform="translate(-50%,-50%)";

  setCameraStatus("Face Tracking ပိတ်ထားပါသည်");
  return;
 }

 try{
  setCameraStatus("Face Tracking Model ဖွင့်နေပါသည်...");
  await loadFaceDetector();

  faceTracking=true;
  $("tmkFaceTrack").classList.add("active");
  $("tmkFaceTrack").textContent="🎯 Face Track: ON";
  faceLoopId=requestAnimationFrame(faceTrackingLoop);
  setCameraStatus("မျက်နှာကို လိုက်ပြီး Sticker တပ်ပေးနေပါသည်");
 }catch(e){
  setCameraStatus("Face Tracking မရပါ: "+e.message);
  alert("Face Tracking Model မဖွင့်နိုင်ပါ။ Internet ချိတ်ဆက်ပြီး HTTPS ဖြင့် ပြန်စမ်းပါ။");
 }
};

/* CAMERA EFFECTS */
function applyCameraEffect(effect){
 currentEffect=effect;
 camera.style.filter=effect;

 document.querySelectorAll("#tmkEffectList button").forEach(b=>{
  b.classList.toggle("active",b.dataset.effect===effect);
 });
}

$("tmkEffectList").addEventListener("click",e=>{
 const b=e.target.closest("button[data-effect]");
 if(b)applyCameraEffect(b.dataset.effect);
});

/* CAMERA ZOOM */
function updateCameraZoom(value){
 cameraZoom=Math.max(1,Math.min(3,Number(value)||1));
 $("tmkZoom").value=cameraZoom;
 $("tmkZoomValue").textContent=cameraZoom.toFixed(1)+"×";

 camera.style.transform=
  (facing==="user"?"scaleX(-1) ":"")+
  `scale(${cameraZoom})`;

 if(faceTracking)positionTrackedSticker();
}

$("tmkZoom").addEventListener("input",e=>{
 updateCameraZoom(e.target.value);
});

/* STICKERS */
$("tmkStickerList").addEventListener("click",e=>{
 const b=e.target.closest("button[data-sticker]");
 if(!b)return;

 currentSticker=b.dataset.sticker;
 $("tmkStickerOverlay").textContent=currentSticker;

 if(faceTracking){
  positionTrackedSticker();
 }else{
  const el=$("tmkStickerOverlay");
  el.style.display=currentSticker?"block":"none";
  el.style.left="50%";
  el.style.top="24%";
  el.style.right="auto";
  el.style.transform="translate(-50%,-50%)";
  el.style.fontSize="76px";
 }

 document.querySelectorAll("#tmkStickerList button").forEach(x=>{
  x.classList.toggle("active",x===b);
 });
});

/* OPEN AND CLOSE CAMERA */
$("tmkOpenCamera").onclick=async()=>{
 cameraScreen.classList.add("open");
 await startCamera();
};

$("tmkCloseCamera").onclick=()=>{
 if(recording)stopRecording();
 stopCamera();
 cameraScreen.classList.remove("open");
};

function stopCamera(){
 faceTracking=false;
 cancelAnimationFrame(faceLoopId);
 trackedFace=null;

 $("tmkFaceTrack").classList.remove("active");
 $("tmkFaceTrack").textContent="🎯 Face Track: OFF";
 $("tmkStickerOverlay").style.display="none";

 if(cameraStream){
  cameraStream.getTracks().forEach(t=>t.stop());
  cameraStream=null;
 }

 camera.srcObject=null;
 torchOn=false;
 $("tmkFlash").textContent="⚡ မီး";
}

/* SWITCH CAMERA */
$("tmkSwitchCamera").onclick=async()=>{
 facing=facing==="user"?"environment":"user";
 torchOn=false;
 await startCamera();
};

/* START CAMERA */
async function startCamera(){
 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw Error("HTTPS Website မှာသာ Camera ဖွင့်နိုင်ပါတယ်");
  }

  if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());

  cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:{ideal:facing},
    width:{ideal:1080},
    height:{ideal:1920}
   },
   audio:true
  });

  camera.srcObject=cameraStream;
  camera.style.filter=currentEffect;
  updateCameraZoom(cameraZoom);
  await camera.play();
  setCameraStatus("Camera အသင့်ဖြစ်ပါပြီ");
 }catch(e){
  setCameraStatus("Camera Error: "+e.message);
  alert("Camera ဖွင့်မရပါ။ Browser Permission ကို Allow လုပ်ပြီး HTTPS နဲ့ဖွင့်ပါ။");
 }
}

/* FLASH */
$("tmkFlash").onclick=async()=>{
 if(!cameraStream)return;

 const track=cameraStream.getVideoTracks()[0];
 const caps=track.getCapabilities?.();

 if(!caps?.torch){
  setCameraStatus("ဒီကင်မရာမှာ Flash မထောက်ပံ့ပါ");
  return;
 }

 try{
  torchOn=!torchOn;
  await track.applyConstraints({advanced:[{torch:torchOn}]});
  $("tmkFlash").textContent=torchOn?"⚡ မီးပိတ်":"⚡ မီး";
 }catch(e){
  torchOn=false;
  setCameraStatus("Flash မဖွင့်နိုင်ပါ");
 }
};

/* RECORD BUTTONS */
$("tmkRecord").onclick=startRecording;
$("tmkStop").onclick=stopRecording;

/* RECORD VIDEO WITH EFFECT AND STICKER */
function startRecording(){
 if(!cameraStream)return alert("Camera အရင်ဖွင့်ပါ");
 if(recording)return;

 if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){
  return alert("ဒီ Browser မှာ Video Recording မထောက်ပံ့ပါ");
 }

 const w=camera.videoWidth||720;
 const h=camera.videoHeight||1280;
 const canvas=document.createElement("canvas");
 canvas.width=w;
 canvas.height=h;
 const ctx=canvas.getContext("2d");

 recording=true;
 $("tmkRecord").classList.add("recording");

 function draw(){
  if(!recording)return;

  ctx.save();
  if(facing==="user"){
   ctx.translate(w,0);
   ctx.scale(-1,1);
  }

  ctx.filter=currentEffect;
  const dw=w*cameraZoom;
  const dh=h*cameraZoom;

  ctx.drawImage(camera,(w-dw)/2,(h-dh)/2,dw,dh);
  ctx.restore();

  if(currentSticker){
   ctx.save();
   ctx.textAlign="center";

   if(faceTracking&&trackedFace){
    const b=trackedFace;
    let x=b.originX+b.width/2;
    let y=b.originY+b.height*.12;
    if(facing==="user")x=w-x;
    x=(x-w/2)*cameraZoom+w/2;
    y=(y-h/2)*cameraZoom+h/2;
    ctx.font=`${Math.round(Math.max(48,Math.min(180,b.width*.75)))}px sans-serif`;
    ctx.fillText(currentSticker,x,y);
   }else{
    ctx.font=`${Math.round(w*.16)}px sans-serif`;
    ctx.fillText(currentSticker,w/2,h*.28);
   }

   ctx.restore();
  }

  animationId=requestAnimationFrame(draw);
 }

 draw();
 canvasStream=canvas.captureStream(30);

 cameraStream.getAudioTracks().forEach(t=>canvasStream.addTrack(t));

 let opts={};
 if(MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")){
  opts.mimeType="video/webm;codecs=vp8,opus";
 }else if(MediaRecorder.isTypeSupported("video/webm")){
  opts.mimeType="video/webm";
 }

 try{
  recorder=new MediaRecorder(canvasStream,opts);
 }catch(e){
  recording=false;
  cancelAnimationFrame(animationId);
  canvasStream.getTracks().forEach(t=>t.stop());
  canvasStream=null;
  alert("Recording စတင်မရပါ: "+e.message);
  return;
 }

 const chunks=[];

 recorder.ondataavailable=e=>{
  if(e.data&&e.data.size)chunks.push(e.data);
 };

 recorder.onerror=e=>{
  setCameraStatus("Recording Error");
 };

 recorder.onstop=()=>{
  recordedBlob=new Blob(chunks,{type:recorder.mimeType||"video/webm"});

  if(recordedUrl)URL.revokeObjectURL(recordedUrl);
  recordedUrl=URL.createObjectURL(recordedBlob);

  preview.src=recordedUrl;
  preview.load();

  $("tmkRecord").classList.remove("recording");

  canvasStream?.getTracks().forEach(t=>t.stop());
  canvasStream=null;

  setCameraStatus("Preview ကြည့်ပြီး Upload တင်နိုင်ပါပြီ");
 };

 recorder.start(500);
 setCameraStatus("🔴 Video ရိုက်ကူးနေပါသည်...");
}

function stopRecording(){
 if(!recording)return;

 recording=false;
 if(animationId)cancelAnimationFrame(animationId);

 if(recorder&&recorder.state==="recording")recorder.stop();

 $("tmkRecord").classList.remove("recording");
 setCameraStatus("Video ပြင်ဆင်နေပါသည်...");
}

/* UPLOAD CAMERA VIDEO */
$("tmkCameraUpload").onclick=async()=>{
 if(!recordedBlob)return alert("Video အရင်ရိုက်ကူးပါ");

 $("tmkCameraUpload").disabled=true;

 try{
  const file=new File(
   [recordedBlob],
   "tmk-camera-"+Date.now()+".webm",
   {type:"video/webm"}
  );

  await uploadVideoFile(
   file,
   $("cameraTitle").value.trim(),
   $("cameraCaption").value.trim()
  );

  alert("Camera Video Upload အောင်မြင်ပါသည် ❤️");

  recordedBlob=null;

  if(recordedUrl){
   URL.revokeObjectURL(recordedUrl);
   recordedUrl=null;
  }

  preview.removeAttribute("src");
  preview.load();
  $("cameraTitle").value="";
  $("cameraCaption").value="";
  showPage("homePage");

 }catch(e){
  alert("Upload Error: "+e.message);
 }finally{
  $("tmkCameraUpload").disabled=false;
 }
};

window.addEventListener("pagehide",()=>{
 if(recording)stopRecording();
 stopCamera();

 if(canvasStream)canvasStream.getTracks().forEach(t=>t.stop());

 clearListeners();
 if(commentUnsubscribe)commentUnsubscribe();
});

/* VIDEO UPLOAD DATE FORMAT */
function formatUploadDate(timestamp){
 if(!timestamp)return "ရက်စွဲမသိပါ";

 const date=new Date(Number(timestamp));
 if(isNaN(date.getTime()))return "ရက်စွဲမသိပါ";

 return new Intl.DateTimeFormat("my-MM",{
  year:"numeric",
  month:"long",
  day:"numeric",
  hour:"2-digit",
  minute:"2-digit",
  hour12:true
 }).format(date);
}
