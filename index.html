
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#08080d">
<title>TMK VIDEO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#08080d;color:white;font-family:Arial,sans-serif}
body{overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{height:58px;background:#101018;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #292936}
.logo{font-size:23px;font-weight:900;color:#00e5ff}
.header-search{width:42px;height:38px;border:0;border-radius:50%;background:#252535;color:white;font-size:22px}
.page{display:none;height:calc(100dvh - 123px);overflow-y:auto;padding-bottom:10px}
.page.active{display:block}
.page-title{padding:18px 16px 8px;font-size:21px}
.muted{color:#aaa}
.feed{width:100%;height:100%;max-width:650px;margin:auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.video-card{position:relative;width:100%;height:100%;min-height:100%;background:#15151e;overflow:hidden;scroll-snap-align:start}
.video-card iframe,.video-card video{width:100%;height:100%;border:0;background:#000;display:block;object-fit:contain}
.video-overlay{position:absolute;left:0;right:0;bottom:0;padding:75px 85px 25px 15px;background:linear-gradient(transparent,rgba(0,0,0,.88));pointer-events:none}
.video-title{font-size:17px;font-weight:bold;margin-bottom:8px;overflow-wrap:anywhere}
.video-owner{font-size:13px;color:#ddd}
.video-actions{position:absolute;right:10px;bottom:35px;display:flex;flex-direction:column;align-items:center;gap:18px}
.action-btn{border:0;background:#0009;color:white;width:48px;height:48px;border-radius:50%;font-size:23px}
.action-btn.liked{color:#ff315b}
.action-label{font-size:11px;text-align:center}
.video-delete{position:absolute;top:12px;left:12px;background:#ed3434;color:white;border:0;padding:8px 12px;border-radius:7px;font-size:12px}
.empty{padding:45px 20px;text-align:center;color:#aaa;line-height:1.8}
.search-box{margin:12px 15px}
input{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #393948;background:#191923;color:white;outline:none}
input:focus{border-color:#00d9ee}
input[type=file]{background:#191923}
.primary-btn{border:0;background:#00d9ee;color:#08080d;padding:12px 17px;border-radius:9px;font-weight:bold;margin:4px 0}
.danger-btn{background:#ed3434;color:white}
.card{background:#171721;border:1px solid #292936;border-radius:13px;padding:16px;margin:12px}
.card h3{margin-top:0}
#message,#profileMessage,#uploadMessage{color:#00e5ff;padding:8px 0;overflow-wrap:anywhere}
.profile-box{text-align:center;padding:20px 10px}
.profile-photo{width:115px;height:115px;border-radius:50%;object-fit:cover;border:3px solid #00e5ff;background:#333}
.profile-name{font-size:22px;color:#00e5ff}
.profile-email{color:#aaa;overflow-wrap:anywhere}
.stats{display:flex;justify-content:center;gap:35px;margin:20px 0;padding:16px;background:#22222f;border-radius:12px}
.stats strong{display:block;font-size:23px;color:#00e5ff}
.stats span{font-size:12px;color:#aaa}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;height:65px;display:flex;justify-content:space-around;align-items:center;background:#111119;border-top:1px solid #30303a;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{border:0;background:none;color:#aaa;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;min-width:55px}
.nav-btn .nav-icon{font-size:22px}
.nav-btn.active{color:#00e5ff}
.upload-nav{background:#00d9ee;color:#08080d;width:43px;height:31px;border-radius:9px;font-size:25px;font-weight:bold;line-height:28px}
@media(min-width:700px){.feed{max-width:480px}.video-card{border-radius:12px}}
</style>
</head>
<body>
<header>
<div class="logo">TMK VIDEO</div>
<button class="header-search" id="searchHeader">⌕</button>
</header>

<section id="homePage" class="page active">
<div class="feed" id="videoFeed"></div>
</section>

<section id="discoverPage" class="page">
<h2 class="page-title">🔎 Discover</h2>
<div class="search-box"><input id="searchInput" placeholder="Video အမည် ရှာပါ..."></div>
<div id="searchResults"></div>
</section>

<section id="uploadPage" class="page">
<h2 class="page-title">🎥 Video တင်ရန်</h2>
<div class="card">
<h3>ဖုန်းထဲမှ Video တင်ရန်</h3>
<input id="fileTitle" placeholder="ဗီဒီယိုအမည်">
<input type="file" id="videoFile" accept="video/mp4,video/webm,video/quicktime">
<button class="primary-btn" id="uploadFileBtn">＋ ဖုန်းထဲမှ Video တင်မည်</button>
<p id="uploadMessage"></p>
</div>
<div class="card">
<h3>YouTube Video တင်ရန်</h3>
<input id="videoTitle" placeholder="ဗီဒီယိုအမည်">
<input id="videoLink" placeholder="YouTube Video Link">
<button class="primary-btn" id="addVideoBtn">＋ YouTube Video တင်မည်</button>
</div>
</section>

<section id="profilePage" class="page">
<h2 class="page-title">👤 My Profile</h2>
<div id="authBox" class="card">
<h3>Login / Register</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="primary-btn" id="registerBtn">Register</button>
<button class="primary-btn" id="loginBtn">Login</button>
<p id="message">Not logged in</p>
</div>
<div id="profileBox" class="card hidden">
<div class="profile-box">
<img id="profilePhoto" class="profile-photo" src="https://placehold.co/200x200/252535/00e5ff?text=TMK" alt="Profile">
<h3 id="displayName" class="profile-name">TMK User</h3>
<p id="displayEmail" class="profile-email"></p>
<div class="stats"><div><strong id="videoCount">0</strong><span>My Videos</span></div></div>
</div>
<h3>Change Profile</h3>
<label>Profile ဓာတ်ပုံ</label>
<input type="file" id="profilePhotoInput" accept="image/*">
<input id="usernameInput" maxlength="30" placeholder="Username အသစ်">
<button class="primary-btn" id="saveProfileBtn">Save Profile</button>
<p id="profileMessage"></p>
<button class="primary-btn danger-btn" id="logoutBtn" style="width:100%">Logout</button>
</div>
<div class="card"><h3>About TMK VIDEO</h3><p class="muted">Welcome to TMK Official Video Platform.</p><p class="muted">© 2026 TMK VIDEO</p></div>
</section>

<nav class="bottom-nav">
<button class="nav-btn active" data-page="homePage"><span class="nav-icon">⌂</span>Home</button>
<button class="nav-btn" data-page="discoverPage"><span class="nav-icon">⌕</span>Discover</button>
<button class="nav-btn" data-page="uploadPage"><span class="upload-nav">＋</span>Upload</button>
<button class="nav-btn" data-page="profilePage"><span class="nav-icon">♙</span>Profile</button>
</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
getDatabase,ref,push,set,update,onValue,off,remove
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

/* FIREBASE CONFIG */
const firebaseConfig={
apiKey:"AIzaSyAQxjXOcFEBRv-yrFsxU1Z7tSLjT74UC_M",
authDomain:"tmk-video.firebaseapp.com",
databaseURL:"https://tmk-video-default-rtdb.firebaseio.com",
projectId:"tmk-video",
storageBucket:"tmk-video.firebasestorage.app",
messagingSenderId:"763253894514",
appId:"1:763253894514:web:5b671edd58fe2d312381eb",
measurementId:"G-NZXE0Y822B"
};

/* SUPABASE CONFIG:*/
const SUPABASE_URL="https://neatplekkujtxkajmeyg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_kqIXSOVr4uDQOHgS29oH_A_YOqnKxR4";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const UPLOAD_FUNCTION_URL=SUPABASE_URL+"/functions/v1/tmk-video-upload";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const database=getDatabase(app);
const videosRef=ref(database,"videos");
let savedVideos=[];
let profileData={};
let selectedPhoto=null;
let currentProfileRef=null;
let currentProfileCallback=null;
let feedObserver=null;
let likedIds={};
let likeCallbacks={};

function showPage(pageId){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(pageId).classList.add("active");
document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===pageId));
if(pageId==="homePage")setTimeout(observeFeedVideos,150);else pauseAllVideos();
}
document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>showPage(b.dataset.page));
document.getElementById("searchHeader").onclick=()=>{
showPage("discoverPage");document.getElementById("searchInput").focus();
};

document.getElementById("registerBtn").onclick=async()=>{
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const msg=document.getElementById("message");
if(!email||!password){msg.textContent="Email နဲ့ Password ထည့်ပါ။";return;}
try{await createUserWithEmailAndPassword(auth,email,password);msg.textContent="Register successful!";}
catch(e){msg.textContent=e.message;}
};
document.getElementById("loginBtn").onclick=async()=>{
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const msg=document.getElementById("message");
if(!email||!password){msg.textContent="Email နဲ့ Password ထည့်ပါ။";return;}
try{await signInWithEmailAndPassword(auth,email,password);msg.textContent="Login successful!";}
catch(e){msg.textContent=e.message;}
};
document.getElementById("logoutBtn").onclick=async()=>{
try{await signOut(auth);document.getElementById("message").textContent="Logout successful!";}
catch(e){document.getElementById("profileMessage").textContent=e.message;}
};

function renderProfile(user){
document.getElementById("profilePhoto").src=profileData.photoData||"https://placehold.co/200x200/252535/00e5ff?text=TMK";
document.getElementById("displayName").textContent=profileData.username||user.email.split("@")[0];
document.getElementById("displayEmail").textContent=user.email;
document.getElementById("usernameInput").value=profileData.username||"";
document.getElementById("videoCount").textContent=savedVideos.filter(v=>v.uid===user.uid).length;
}

function listenLikes(user){
Object.values(likeCallbacks).forEach(item=>off(item.ref,"value",item.callback));
likeCallbacks={};likedIds={};
if(!user){renderVideos();return;}
savedVideos.forEach(video=>{
const likeRef=ref(database,"likes/"+video.id+"/"+user.uid);
const callback=snapshot=>{
likedIds[video.id]=snapshot.val()===true;
const btn=document.querySelector('[data-like="'+video.id+'"]');
if(btn)btn.classList.toggle("liked",likedIds[video.id]);
const label=document.querySelector('[data-like-label="'+video.id+'"]');
if(label)label.textContent=likedIds[video.id]?"Liked":"Like";
};
onValue(likeRef,callback);
likeCallbacks[video.id]={ref:likeRef,callback};
});
}
onAuthStateChanged(auth,user=>{
if(currentProfileRef&&currentProfileCallback)off(currentProfileRef,"value",currentProfileCallback);
currentProfileRef=null;currentProfileCallback=null;profileData={};
if(user){
document.getElementById("authBox").classList.add("hidden");
document.getElementById("profileBox").classList.remove("hidden");
currentProfileRef=ref(database,"users/"+user.uid);
currentProfileCallback=s=>{
profileData=s.val()||{};
renderProfile(user);
};
onValue(currentProfileRef,currentProfileCallback);
}else{
document.getElementById("authBox").classList.remove("hidden");
document.getElementById("profileBox").classList.add("hidden");
document.getElementById("message").textContent="Not logged in";
}
listenLikes(user);
renderVideos();
});

document.getElementById("profilePhotoInput").onchange=async e=>{
const file=e.target.files[0];if(!file)return;
if(!file.type.startsWith("image/")||file.size>5*1024*1024){alert("ဓာတ်ပုံဖိုင် 5MB အောက်ကို ရွေးပါ။");e.target.value="";return;}
const img=new Image();const url=URL.createObjectURL(file);img.src=url;
try{
await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;});
const canvas=document.createElement("canvas");
const scale=Math.min(1,400/Math.max(img.width,img.height));
canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
selectedPhoto=canvas.toDataURL("image/jpeg",0.65);
document.getElementById("profilePhoto").src=selectedPhoto;
document.getElementById("profileMessage").textContent="ဓာတ်ပုံရွေးပြီးပါပြီ။ Save Profile နှိပ်ပါ။";
}catch(e){alert("ဓာတ်ပုံဖတ်မရပါ။");}
finally{URL.revokeObjectURL(url);}
};

document.getElementById("saveProfileBtn").onclick=async()=>{
const user=auth.currentUser;if(!user){alert("Login အရင်ဝင်ပါ။");return;}
const username=document.getElementById("usernameInput").value.trim();
const msg=document.getElementById("profileMessage");
if(!username||username.length>30){msg.textContent="Username 1 မှ 30 လုံး ထည့်ပါ။";return;}
const photoData=selectedPhoto!==null?selectedPhoto:(profileData.photoData||"");
if(photoData.length>350000){msg.textContent="ဓာတ်ပုံအရွယ်အစား ကြီးနေပါတယ်။";return;}
try{
msg.textContent="Saving...";
await update(ref(database,"users/"+user.uid),{username,photoData,updatedAt:Date.now()});
selectedPhoto=null;document.getElementById("profilePhotoInput").value="";
msg.textContent="Profile သိမ်းပြီးပါပြီ။";
}catch(e){msg.textContent="သိမ်းမရပါ: "+e.message;}
};

function pauseAllVideos(){
document.querySelectorAll(".video-card iframe").forEach(f=>{
try{f.contentWindow.postMessage(JSON.stringify({event:"command",func:"pauseVideo",args:[]}),"*");}catch(e){}
});
document.querySelectorAll(".video-card video").forEach(v=>v.pause());
}
function observeFeedVideos(){
if(feedObserver)feedObserver.disconnect();
const feed=document.getElementById("videoFeed");
feedObserver=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
const iframe=entry.target.querySelector("iframe");
const video=entry.target.querySelector("video");
if(entry.isIntersecting&&entry.intersectionRatio>=0.65){
if(iframe)iframe.contentWindow.postMessage(JSON.stringify({event:"command",func:"playVideo",args:[]}),"*");
if(video)video.play().catch(()=>{});
}else{
if(iframe)iframe.contentWindow.postMessage(JSON.stringify({event:"command",func:"pauseVideo",args:[]}),"*");
if(video)video.pause();
}
});
},{root:feed,threshold:[0,0.65,0.9]});
feed.querySelectorAll(".video-card").forEach(c=>feedObserver.observe(c));
}

async function toggleLike(videoId,button,label){
const user=auth.currentUser;
if(!user){alert("Like လုပ်ရန် Login ဝင်ပါ။");showPage("profilePage");return;}
const next=!likedIds[videoId];
try{
const likeRef=ref(database,"likes/"+videoId+"/"+user.uid);
if(next)await set(likeRef,true);else await remove(likeRef);
likedIds[videoId]=next;
button.classList.toggle("liked",next);
label.textContent=next?"Liked":"Like";
}catch(e){alert("Like မလုပ်နိုင်ပါ: "+e.message);}
}

function renderVideos(){
const feed=document.getElementById("videoFeed");feed.innerHTML="";
if(!savedVideos.length){
feed.innerHTML='<div class="empty"><h2>🎬 TMK VIDEO</h2><p>ဗီဒီယို မရှိသေးပါ။</p><p>Upload ကိုနှိပ်ပြီး Video တင်နိုင်ပါတယ်။</p></div>';return;
}
savedVideos.forEach(video=>{
const card=document.createElement("article");card.className="video-card";
if(video.youtubeId){
const iframe=document.createElement("iframe");
iframe.src="https://www.youtube.com/embed/"+encodeURIComponent(video.youtubeId)+"?playsinline=1&rel=0&enablejsapi=1&autoplay=1&mute=1";
iframe.title=video.title||"TMK Video";
iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
iframe.allowFullscreen=true;card.appendChild(iframe);
}else if(video.videoUrl){
const player=document.createElement("video");
player.src=video.videoUrl;player.controls=true;player.playsInline=true;player.muted=true;
card.appendChild(player);
}
const overlay=document.createElement("div");overlay.className="video-overlay";
const title=document.createElement("div");title.className="video-title";title.textContent=video.title||"TMK VIDEO";
const owner=document.createElement("div");owner.className="video-owner";owner.textContent="@"+(video.username||"TMK User");
overlay.append(title,owner);
const actions=document.createElement("div");actions.className="video-actions";
const likeWrap=document.createElement("div");
const likeBtn=document.createElement("button");likeBtn.className="action-btn"+(likedIds[video.id]?" liked":"");likeBtn.textContent="♥";likeBtn.dataset.like=video.id;
const likeLabel=document.createElement("div");likeLabel.className="action-label";likeLabel.dataset.likeLabel=video.id;likeLabel.textContent=likedIds[video.id]?"Liked":"Like";
likeBtn.onclick=()=>toggleLike(video.id,likeBtn,likeLabel);
likeWrap.append(likeBtn,likeLabel);
const shareWrap=document.createElement("div");
const shareBtn=document.createElement("button");shareBtn.className="action-btn";shareBtn.textContent="↗";
const shareLabel=document.createElement("div");shareLabel.className="action-label";shareLabel.textContent="Share";
shareBtn.onclick=async()=>{
const url=video.videoUrl||("https://www.youtube.com/watch?v="+video.youtubeId);
try{if(navigator.share)await navigator.share({title:video.title,url});else{await navigator.clipboard.writeText(url);alert("Link Copy လုပ်ပြီးပါပြီ။");}}catch(e){}
};
shareWrap.append(shareBtn,shareLabel);
actions.append(likeWrap,shareWrap);
card.append(overlay,actions);
if(auth.currentUser&&auth.currentUser.uid===video.uid){
const del=document.createElement("button");del.className="video-delete";del.textContent="Delete";
del.onclick=async()=>{
if(!confirm("ဒီ Video ကို ဖျက်မှာ သေချာပါသလား။"))return;
try{
await remove(ref(database,"videos/"+video.id));
if(video.storagePath)await supabase.storage.from("tmk-videos").remove([video.storagePath]);
}catch(e){alert("ဖျက်မရပါ: "+e.message);}
};
card.appendChild(del);
}
feed.appendChild(card);
});
if(auth.currentUser)renderProfile(auth.currentUser);
if(document.getElementById("homePage").classList.contains("active"))observeFeedVideos();
}
onValue(videosRef,snapshot=>{
savedVideos=[];
snapshot.forEach(child=>savedVideos.push({id:child.key,...child.val()}));
savedVideos.reverse();renderVideos();listenLikes(auth.currentUser);
},error=>{document.getElementById("message").textContent="Video loading error: "+error.message;});

function extractYouTubeId(link){
try{
const url=new URL(link);let id="";
if(url.hostname==="youtu.be")id=url.pathname.split("/").filter(Boolean)[0]||"";
else if(url.hostname.includes("youtube.com")||url.hostname.includes("youtube-nocookie.com"))id=url.searchParams.get("v")||url.pathname.split("/").filter(Boolean).pop()||"";
return /^[A-Za-z0-9_-]{11}$/.test(id)?id:"";
}catch(e){return "";}
}
document.getElementById("addVideoBtn").onclick=async()=>{
const title=document.getElementById("videoTitle").value.trim();
const videoId=extractYouTubeId(document.getElementById("videoLink").value.trim());
const msg=document.getElementById("uploadMessage");
if(!auth.currentUser){msg.textContent="Video တင်ရန် Login ဝင်ပါ။";return;}
if(!title||!videoId){msg.textContent="Video အမည်နဲ့ YouTube Link မှန်မှန်ထည့်ပါ။";return;}
try{
await push(videosRef,{title,youtubeId:videoId,uid:auth.currentUser.uid,username:profileData.username||auth.currentUser.email.split("@")[0],createdAt:Date.now()});
document.getElementById("videoTitle").value="";document.getElementById("videoLink").value="";
msg.textContent="YouTube Video တင်ပြီးပါပြီ။";showPage("homePage");
}catch(e){msg.textContent="တင်မရပါ: "+e.message;}
};

document.getElementById("uploadFileBtn").onclick=async()=>{
const user=auth.currentUser;
const file=document.getElementById("videoFile").files[0];
const title=document.getElementById("fileTitle").value.trim();
const msg=document.getElementById("uploadMessage");
if(!user){msg.textContent="Video တင်ရန် Login ဝင်ပါ။";return;}
if(!file||!title){msg.textContent="Video ဖိုင်နဲ့ အမည် ရွေးထည့်ပါ။";return;}
if(!["video/mp4","video/webm","video/quicktime"].includes(file.type)){msg.textContent="MP4, WebM သို့မဟုတ် MOV Video ကိုသာ တင်နိုင်ပါတယ်။";return;}
if(file.size>50*1024*1024){msg.textContent="Video ဖိုင် 50MB ထက် မကြီးရပါ။";return;}
if(SUPABASE_URL.startsWith("YOUR_")||SUPABASE_PUBLISHABLE_KEY.startsWith("YOUR_")){msg.textContent="Supabase URL နဲ့ Publishable Key ကို Code ထဲ ထည့်ပါ။";return;}
try{
msg.textContent="Upload ခွင့်တောင်းနေပါတယ်...";
const idToken=await user.getIdToken();
const response=await fetch(UPLOAD_FUNCTION_URL,{
method:"POST",
headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+idToken},
body:JSON.stringify({filename:file.name,contentType:file.type})
});
const permission=await response.json();
if(!response.ok||!permission.success)throw new Error(permission.error||"Upload permission failed");
msg.textContent="Video တင်နေပါတယ်...";
const {error:uploadError}=await supabase.storage.from("tmk-videos").uploadToSignedUrl(permission.path,permission.token,file);
if(uploadError)throw uploadError;
msg.textContent="Video အချက်အလက် သိမ်းနေပါတယ်...";
await push(videosRef,{
title,videoUrl:permission.publicUrl,storagePath:permission.path,
uid:user.uid,username:profileData.username||user.email.split("@")[0],
createdAt:Date.now()
});
document.getElementById("videoFile").value="";
document.getElementById("fileTitle").value="";
msg.textContent="Video တင်ပြီးပါပြီ။";
showPage("homePage");
}catch(e){msg.textContent="Upload မအောင်မြင်ပါ: "+e.message;}
};

<div id="tmkCameraBox">
  <h3>🎥 TMK VIDEO CAMERA</h3>

  <video id="tmkCamera" autoplay muted playsinline></video>

  <div class="tmk-controls">
    <button onclick="tmkStartCamera()">📷 Open Camera</button>
    <button onclick="tmkSwitchCamera()">🔄 Switch Camera</button>
    <button class="record" onclick="tmkStartRecord()">🔴 Record</button>
    <button onclick="tmkStopRecord()">⏹ Stop</button>
  </div>

  <p>✨ Choose Effects</p>
  <select id="tmkEffect" onchange="tmkApplyEffect()">
    <option value="none">Normal</option>
    <option value="brightness(1.3) contrast(1.1)">Bright</option>
    <option value="grayscale(1)">Black & White</option>
    <option value="sepia(0.8)">Vintage</option>
    <option value="sepia(0.5) contrast(1.2)">Sepia</option>
    <option value="brightness(1.1) saturate(1.5)">Colorful</option>
  </select>

  <h4>🎬 Video Preview</h4>
  <video id="tmkPreview" controls playsinline></video>

  <div class="tmk-controls">
    <button onclick="tmkUploadVideo()">⬆️ Upload Video</button>
  </div>

  <div id="tmkProgress">
    <div id="tmkProgressBar"></div>
  </div>
  <div id="tmkPercent">0%</div>
  <p id="tmkStatus">Ready</p>
</div>

<script>
let tmkStream=null;
let tmkRecorder=null;
let tmkChunks=[];
let tmkFacing="user";
let tmkRecordedBlob=null;

async function tmkStartCamera(){
  try{
    if(tmkStream){
      tmkStream.getTracks().forEach(t=>t.stop());
    }

    tmkStream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:tmkFacing,
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:true
    });

    const camera=document.getElementById("tmkCamera");
    camera.srcObject=tmkStream;
    tmkApplyEffect();
    document.getElementById("tmkStatus").textContent="Camera Ready";
  }catch(e){
    alert("Camera ဖွင့်မရပါ။ Permission ပေးပြီး HTTPS Website မှာ ပြန်စမ်းပါ။");
  }
}

async function tmkSwitchCamera(){
  tmkFacing=tmkFacing==="user"?"environment":"user";
  await tmkStartCamera();
}

function tmkApplyEffect(){
  document.getElementById("tmkCamera").style.filter=
    document.getElementById("tmkEffect").value;
}

/* Effects are applied to the live preview.
   Recording below captures the camera stream itself. */

function tmkStartRecord(){
  if(!tmkStream){
    alert("အရင်ဆုံး Open Camera နှိပ်ပါ");
    return;
  }

  if(!window.MediaRecorder){
    alert("ဒီ Browser မှာ Video Recording မရနိုင်ပါ");
    return;
  }

  tmkChunks=[];
  tmkRecordedBlob=null;

  let options={};
  if(MediaRecorder.isTypeSupported("video/webm;codecs=vp9")){
    options.mimeType="video/webm;codecs=vp9";
  }else if(MediaRecorder.isTypeSupported("video/webm")){
    options.mimeType="video/webm";
  }

  tmkRecorder=new MediaRecorder(tmkStream,options);

  tmkRecorder.ondataavailable=e=>{
    if(e.data.size>0)tmkChunks.push(e.data);
  };

  tmkRecorder.onstop=()=>{
    tmkRecordedBlob=new Blob(tmkChunks,{
      type:tmkRecorder.mimeType || "video/webm"
    });

    const url=URL.createObjectURL(tmkRecordedBlob);
    const preview=document.getElementById("tmkPreview");
    preview.src=url;
    document.getElementById("tmkStatus").textContent=
      "Recording Complete - Preview Ready";
  };

  tmkRecorder.start();
  document.getElementById("tmkStatus").textContent="🔴 Recording...";
}

function tmkStopRecord(){
  if(tmkRecorder && tmkRecorder.state==="recording"){
    tmkRecorder.stop();
  }
}

/* Upload through the existing Supabase Edge Function */
async function tmkUploadVideo(){
  if(!tmkRecordedBlob){
    alert("အရင်ဆုံး Video ရိုက်ပြီး Stop နှိပ်ပါ");
    return;
  }

  if(!window.supabaseClient){
    alert("Supabase client မတွေ့ပါ။ လက်ရှိ Supabase client ကို ချိတ်ဆက်ပေးပါ");
    return;
  }

  try{
    const user=window.firebaseAuth?.currentUser;
    if(!user){
      alert("အရင် Login ဝင်ပါ");
      return;
    }

    const token=await user.getIdToken();
    const ext=tmkRecordedBlob.type.includes("mp4")?"mp4":"webm";
    const filename="tmk-video-"+Date.now()+"."+ext;

    document.getElementById("tmkStatus").textContent="Preparing upload...";

    const response=await fetch(
      window.UPLOAD_FUNCTION_URL,
      {
        method:"POST",
        headers:{
          "Authorization":"Bearer "+token,
          "Content-Type":"application/json",
          "apikey":window.SUPABASE_PUBLISHABLE_KEY
        },
        body:JSON.stringify({
          filename,
          contentType:tmkRecordedBlob.type
        })
      }
    );

    const permission=await response.json();
    if(!response.ok)throw new Error(permission.error || "Upload permission failed");

    const {data,error}=await window.supabaseClient.storage
      .from("tmk-videos")
      .uploadToSignedUrl(permission.path,permission.token,tmkRecordedBlob,{
        contentType:tmkRecordedBlob.type
      });

    if(error)throw error;

    const videoUrl=permission.publicUrl;

    document.getElementById("tmkProgressBar").style.width="100%";
    document.getElementById("tmkPercent").textContent="100%";
    document.getElementById("tmkStatus").textContent="Upload Complete!";

    alert("Video Upload ပြီးပါပြီ။");

    /* Save video metadata to Firebase */
    const db=window.firebaseDatabase;
    const uid=user.uid;
    const videoRef=window.firebasePush(window.firebaseRef(db,"videos"));

    await window.firebaseSet(videoRef,{
      title:filename,
      videoUrl:videoUrl,
      storagePath:permission.path,
      uid:uid,
      username:user.displayName || "TMK User",
      createdAt:Date.now()
    });

  }catch(error){
    console.error(error);
    document.getElementById("tmkStatus").textContent=
      "Upload Error: "+error.message;
    alert("Upload မအောင်မြင်ပါ: "+error.message);
  }
}

</script>
</body>
