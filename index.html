<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="TMK VIDEO Short Video Platform">
<title>TMK VIDEO — Short Video</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<style>
:root{--bg:#090910;--panel:#171722;--line:#292938;--pink:#ff315b;--cyan:#28e0c0;--muted:#a6a6b5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
body{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

.topbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:30;display:flex;align-items:center;justify-content:center;background:linear-gradient(#090910f5,#090910a8,transparent)}
.tabs{display:flex;align-items:center;gap:19px}
.tabs button{background:transparent;color:#aaa;font-size:14px;padding:9px 0}
.tabs button.active{color:#fff;font-weight:bold;border-bottom:3px solid var(--cyan)}

.page{display:none;position:absolute;inset:0;background:var(--bg)}
.page.active{display:block}
#homePage{overflow:hidden}
#feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.video-card{width:100%;height:100%;min-height:100%;position:relative;background:#000;overflow:hidden;scroll-snap-align:start}
.video-media{position:absolute;inset:0}
.video-media video,.video-media iframe{width:100%;height:100%;border:0;object-fit:cover;background:#000}
.video-media iframe{position:absolute}
.video-media:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#0008);pointer-events:none}

/* VIDEO PLAY / PAUSE BUTTON */
.video-play-toggle{
 position:absolute;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 z-index:9;
 width:68px;
 height:68px;
 border-radius:50%;
 background:#0009;
 color:#fff;
 font-size:34px;
 display:flex;
 align-items:center;
 justify-content:center;
 border:2px solid #ffffffaa;
 cursor:pointer;
}
.video-play-toggle.hidden{display:none!important}
.video-play-toggle:active{
 transform:translate(-50%,-50%) scale(.92);
}

.actions{position:absolute;right:9px;bottom:112px;z-index:8;width:55px;display:flex;flex-direction:column;align-items:center;gap:12px}
.actions button{width:48px;height:48px;border-radius:50%;background:#15151dba;color:#fff;font-size:25px;padding:0;backdrop-filter:blur(8px)}
.actions small{font-size:11px;color:#fff;margin-top:-10px;text-shadow:0 1px 3px #000}
.actions .liked{color:var(--pink)}
.actions .saved{background:#fff!important;color:#111!important}
.follow-button{width:34px!important;height:34px!important;border-radius:50%!important;background:#ff315b!important;color:#fff!important;font-size:23px!important;font-weight:bold!important;line-height:1}
.follow-button.following{background:#20c879!important;color:#fff!important;font-size:20px!important}

.video-info{position:absolute;left:13px;right:76px;bottom:90px;z-index:6;text-shadow:0 1px 4px #000}
.video-info strong{font-size:16px}
.video-info p{font-size:14px;line-height:1.4;margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.music-label{font-size:12px;margin-top:10px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:66px;background:#0b0b12f5;border-top:1px solid #242432;display:flex;align-items:center;justify-content:space-around;z-index:50;backdrop-filter:blur(16px);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;height:100%;background:transparent;color:#aaa;font-size:11px;padding:5px 0}
.bottom-nav button.active{color:var(--cyan)}
.bottom-nav button span{display:block;font-size:23px;margin-bottom:3px}
.bottom-nav .upload-icon{background:#fff;color:#000;border-radius:9px;width:43px;height:29px;margin:0 auto;font-size:25px}

.other-page{padding:76px 14px 90px;overflow-y:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:14px}
input,textarea,select{width:100%;padding:13px;margin:7px 0;background:#242432;color:#fff;border:1px solid #39394b;border-radius:11px}
textarea{min-height:75px}
.btn{background:#29293a;color:#fff;padding:12px 15px;border-radius:10px;margin:4px 2px;font-weight:bold}
.primary{background:var(--cyan);color:#06120f}
.danger{background:#c83752;color:#fff}
.status{color:var(--cyan);font-size:13px}
.muted{color:var(--muted);font-size:13px}
.avatar{width:85px;height:85px;border-radius:50%;object-fit:cover;background:#333}
.progress{height:10px;background:#333;border-radius:20px;overflow:hidden}
.progress div{width:0;height:100%;background:var(--cyan)}

/* CAMERA */
.camera-launch{width:100%;padding:18px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff315b,#8b35ff);color:#fff;font-size:17px;font-weight:bold}
.camera-screen{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#000;z-index:1000;display:none;overflow:hidden}
.camera-screen.open{display:block}
#tmkCamera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.camera-top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;z-index:4;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.camera-top button{pointer-events:auto;width:42px;height:42px;border:0;border-radius:50%;background:#171722bb;color:white;font-size:20px}
.camera-top strong{background:#17172299;padding:9px 13px;border-radius:20px;font-size:13px}
.camera-effects{position:absolute;left:0;right:0;bottom:205px;z-index:4;display:flex;gap:9px;overflow-x:auto;padding:12px;scrollbar-width:none}
.camera-effects button{flex:0 0 auto;border:1px solid #ffffff66;border-radius:22px;background:#15151dbb;color:#fff;padding:10px 14px;font-size:13px}
.camera-effects button.active{background:#ff315b;border-color:#ff315b}
.camera-zoom{position:absolute;left:18px;right:18px;bottom:165px;z-index:5;display:flex;align-items:center;gap:10px;color:#fff;text-shadow:0 1px 4px #000}
.camera-zoom input{margin:0;accent-color:#ff315b}
.camera-stickers{position:absolute;left:0;right:0;bottom:105px;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.camera-stickers button{flex:0 0 auto;border:1px solid #ffffff66;border-radius:20px;background:#15151dcc;color:#fff;padding:8px 12px;font-size:22px}
.camera-stickers button.active{background:#ff315b}
.camera-sticker-overlay{position:absolute;top:24%;left:50%;z-index:3;pointer-events:none;text-shadow:0 3px 10px #0008;transform:translate(-50%,-50%);white-space:nowrap}
.face-track-button{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 64px);z-index:6;border:1px solid #ffffff77;border-radius:22px;background:#15151dcc;color:#fff;padding:9px 12px;font-size:12px;font-weight:bold}
.face-track-button.active{background:#20b86b;border-color:#20b86b}
.camera-controls{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:4;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px;flex-wrap:wrap}
.camera-controls button{border:0;border-radius:25px;padding:13px 16px;background:#ffffff30;color:#fff;font-weight:bold}
.camera-controls .record-button{width:68px;height:68px;border:5px solid #fff;border-radius:50%;background:#ff315b;font-size:0;padding:0}
.camera-controls .record-button.recording{background:#fff;border-color:#ff315b;transform:scale(.88)}
.camera-status{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 15px);left:0;right:0;text-align:center;color:white;font-size:12px;z-index:4;text-shadow:0 1px 4px #000}
.camera-preview{width:100%;max-height:55vh;object-fit:contain;background:#000;border-radius:12px}
.camera-edit-fields{padding:12px}
.comment-panel{position:fixed;bottom:65px;left:0;right:0;z-index:60;background:#171720;border-radius:20px 20px 0 0;padding:15px;max-height:70vh;overflow:auto;display:none;border:1px solid #303040}
.comment-panel.open{display:block}
.comment-item{background:#282835;padding:10px;border-radius:10px;margin:7px 0;overflow-wrap:anywhere}
.comment-form{display:flex;gap:5px}
.comment-form textarea{flex:1;min-width:0}
.section-title{font-size:20px;margin:5px 0 14px}
.chip-row{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}
.chip{white-space:nowrap;border:1px solid #353545;background:#1b1b27;color:#ddd;border-radius:22px;padding:9px 13px}
.chip.active{background:var(--cyan);color:#06120f;border-color:var(--cyan)}
.grid-videos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.result-card{background:#191923;border-radius:13px;overflow:hidden}
.result-card video{width:100%;aspect-ratio:9/13;object-fit:cover;background:#000}
.result-card div{padding:9px;font-size:13px}
.empty{color:#aaa;text-align:center;padding:35px 10px}

@media(min-width:700px){
#feed{max-width:440px;left:50%;transform:translateX(-50%)}
.other-page{max-width:650px;margin:auto;left:0;right:0}
}
</style>
</head>
<body>
<header class="topbar">
 <div class="tabs">
  <button id="forYouTab" class="active">သင့်အတွက်</button>
  <button id="followingTab">Following</button>
  <button id="searchTab">ရှာရန်</button>
 </div>
</header>

<section id="homePage" class="page active">
 <div id="feed">Loading videos...</div>
</section>

<section id="uploadPage" class="page other-page">
 <h2>＋ Video Upload</h2>
 <div class="card">
  <input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime">
  <input id="videoTitle" maxlength="100" placeholder="Video ခေါင်းစဉ်">
  <textarea id="videoCaption" maxlength="500" placeholder="Caption"></textarea>
  <button class="btn primary" id="uploadFileBtn">Upload Video</button>
  <div class="progress"><div id="fileProgressBar"></div></div>
  <p id="fileStatus" class="status">အသင့်ဖြစ်ပါပြီ</p>
 </div>
</section>

<section id="discoverPage" class="page other-page">
 <h2>🔎 ရှာဖွေရန်</h2>
 <input id="searchInput" placeholder="Video ရှာရန်">
 <div id="searchResults"></div>
</section>

<section id="profilePage" class="page other-page">
 <div class="card">
  <h2>အကောင့်</h2>
  <input id="authEmail" type="email" placeholder="Email">
  <input id="authPassword" type="password" placeholder="Password">
  <button class="btn primary" id="registerBtn">Register</button>
  <button class="btn" id="loginBtn">Login</button>
  <button class="btn danger hidden" id="logoutBtn">Logout</button>
  <p id="authStatus" class="status"></p>
 </div>
 <div class="card">
  <h3 id="profileName">Guest</h3>
  <p id="profileEmail"></p>
  <input id="editUsername" maxlength="30" placeholder="Username">
  <button class="btn primary" id="saveProfileBtn">Profile သိမ်းရန်</button>
  <p id="profileStatus" class="status"></p>
 </div>
</section>

<nav class="bottom-nav">
 <button class="active" data-page="homePage">⌂ ပင်မ</button>
 <button data-page="discoverPage">⌕ ရှာရန်</button>
 <button data-page="uploadPage">＋ Upload</button>
 <button data-page="profilePage">♙ Profile</button>
</nav>

<div id="commentPanel" class="comment-panel">
 <button class="btn" id="closeComments">ပိတ်ရန် ✕</button>
 <div id="panelComments"></div>
 <textarea id="panelCommentInput" placeholder="Comment ရေးရန်"></textarea>
 <button class="btn primary" id="panelCommentSend">ပို့ရန်</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
 getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
 signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
 getDatabase,ref,push,set,get,onValue,remove
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

/* FIREBASE CONFIG */
const firebaseConfig={
 apiKey:"AIzaSyAQxjXOcFEBRv-yrFsxU1Z7tSLjT74UC_M",
 authDomain:"tmk-video.firebaseapp.com",
 databaseURL:"https://tmk-video-default-rtdb.firebaseio.com",
 projectId:"tmk-video",
 storageBucket:"tmk-video.firebasestorage.app",
 messagingSenderId:"763253894514",
 appId:"1:763253894514:web:5b671edd58fe2d312381eb"
};

/* SUPABASE CONFIG */
const SUPABASE_URL="https://neatplekkujtxkajmeyg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_kqIXSOVr4uDQOHgS29oH_A_YOqnKxR4";
const BUCKET_NAME="tmk-videos";
const UPLOAD_FUNCTION_URL=SUPABASE_URL+"/functions/v1/tmk-video-upload";
const WORKER_URL="https://tmk-video-api.htunminkhant2007.workers.dev";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);

let currentUser=null;
let allVideos=[];
let followingIds=new Set();
let savedVideoIds=new Set();
let feedMode="all";
let videosUnsubscribe=null;
let engagementUnsubscribers=[];
let feedObserver=null;
let selectedCommentVideo=null;
let commentUnsubscribe=null;

function esc(s=""){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 $(id).classList.add("active");
 document.querySelectorAll("[data-page]").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===id);
 });
 if(id==="homePage")setupAutoplay();
 else{
  if(feedObserver)feedObserver.disconnect();
  document.querySelectorAll("#feed video").forEach(v=>v.pause());
 }
}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>showPage(b.dataset.page));
$("searchTab").onclick=()=>showPage("discoverPage");

function clearEngagement(){
 engagementUnsubscribers.forEach(fn=>fn());
 engagementUnsubscribers=[];
 if(feedObserver){feedObserver.disconnect();feedObserver=null;}
}

/* LOAD ALL FIREBASE VIDEOS */
function loadVideos(){
 if(videosUnsubscribe)videosUnsubscribe();
 videosUnsubscribe=onValue(ref(db,"videos"),snap=>{
  allVideos=[];
  if(snap.exists()){
   snap.forEach(child=>{
    allVideos.push({id:child.key,...child.val()});
   });
  }
  allVideos.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  renderFeed(allVideos);
  updateProfileCount();
 },error=>{
  $("feed").textContent="Firebase Error: "+error.message;
 });
}
loadVideos();

function renderFeed(inputVideos){
 clearEngagement();
 let videos=[...inputVideos];

 if(feedMode==="following"&&currentUser){
  videos=videos.filter(v=>v.uid===currentUser.uid||followingIds.has(v.uid));
 }

 if(!videos.length){
  $("feed").innerHTML='<div class="video-card"><div class="video-info">Video မရှိသေးပါ။</div></div>';
  return;
 }

 $("feed").innerHTML=videos.map(v=>{
  const id=esc(v.id);
  const media=v.youtubeId
   ?`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.youtubeId)}?playsinline=1&mute=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`
   :`<video data-feed-video playsinline loop muted preload="metadata" src="${esc(v.videoUrl||"")}"></video>
      <button class="play-button hidden" data-play="${id}">▶</button>`;

  return `<article class="video-card" data-card="${id}">
   <div class="video-media">${media}</div>
   <div class="actions">
    <button data-follow="${esc(v.uid||"")}">＋</button>
    <button data-like="${id}">♡</button><small data-like-count>0</small>
    <button data-comment="${id}">💬</button><small data-comment-count>0</small>
    <button data-share="${id}">↗</button>
    <button data-save="${id}">${savedVideoIds.has(v.id)?"★":"☆"}</button>
    ${v.uid===currentUser?.uid?`<button data-delete="${id}">🗑</button>`:""}
   </div>
   <div class="video-info">
    <strong>@${esc(v.username||"User")}</strong>
    <p>${esc(v.title||"TMK VIDEO")}</p>
    <p>${esc(v.caption||"")}</p>
   </div>
  </article>`;
 }).join("");

 setupVideoButtons();
 videos.forEach(v=>watchEngagement(v.id));
 setupAutoplay();
}

function setupVideoButtons(){
 document.querySelectorAll("#feed [data-play]").forEach(b=>{
  const v=b.closest(".video-card").querySelector("video");
  b.onclick=e=>{
   e.stopPropagation();
   v.play().catch(()=>{});
  };
  v.addEventListener("click",()=>{
   if(v.paused)v.play().catch(()=>{});
   else v.pause();
  });
  v.addEventListener("play",()=>b.classList.add("hidden"));
  v.addEventListener("pause",()=>b.classList.remove("hidden"));
 });

 document.querySelectorAll("#feed [data-like]").forEach(b=>{
  b.onclick=()=>likeVideo(b.dataset.like);
 });
 document.querySelectorAll("#feed [data-comment]").forEach(b=>{
  b.onclick=()=>openComments(b.dataset.comment);
 });
 document.querySelectorAll("#feed [data-follow]").forEach(b=>{
  b.onclick=()=>followUser(b.dataset.follow);
 });
 document.querySelectorAll("#feed [data-save]").forEach(b=>{
  b.onclick=()=>saveVideo(b.dataset.save);
 });
 document.querySelectorAll("#feed [data-share]").forEach(b=>{
  b.onclick=()=>shareVideo(b.dataset.share);
 });
 document.querySelectorAll("#feed [data-delete]").forEach(b=>{
  b.onclick=()=>deleteVideo(b.dataset.delete);
 });
}

function setupAutoplay(){
 if(feedObserver)feedObserver.disconnect();
 if(!("IntersectionObserver"in window))return;
 feedObserver=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
   const video=entry.target;
   if(entry.isIntersecting&&entry.intersectionRatio>=.65){
    document.querySelectorAll("#feed video").forEach(other=>{
     if(other!==video){other.pause();other.muted=true;}
    });
    video.muted=true;
    video.play().catch(()=>{});
   }else video.pause();
  });
 },{threshold:[0,.65,.9]});
 document.querySelectorAll("#feed video[data-feed-video]").forEach(v=>feedObserver.observe(v));
}

function watchEngagement(id){
 const stopLikes=onValue(ref(db,"likes/"+id),snap=>{
  const data=snap.val()||{};
  const count=Object.values(data).filter(x=>x===true).length;
  const card=document.querySelector(`[data-card="${CSS.escape(id)}"]`);
  if(!card)return;
  const button=card.querySelector("[data-like]");
  const number=card.querySelector("[data-like-count]");
  const liked=!!(currentUser&&data[currentUser.uid]===true);
  button.textContent=liked?"♥":"♡";
  button.classList.toggle("liked",liked);
  number.textContent=count;
 });
 const stopComments=onValue(ref(db,"comments/"+id),snap=>{
  let count=0;
  if(snap.exists())snap.forEach(()=>count++);
  const n=document.querySelector(`[data-card="${CSS.escape(id)}"] [data-comment-count]`);
  if(n)n.textContent=count;
 });
 engagementUnsubscribers.push(stopLikes,stopComments);
}

async function likeVideo(id){
 if(!currentUser)return alert("Login အရင်ဝင်ပါ");
 const r=ref(db,"likes/"+id+"/"+currentUser.uid);
 const s=await get(r);
 if(s.exists()&&s.val()===true)await remove(r);
 else await set(r,true);
}

async function followUser(uid){
 if(!currentUser)return alert("Login အရင်ဝင်ပါ");
 if(!uid||uid===currentUser.uid)return;
 const r=ref(db,"follows/"+uid+"/"+currentUser.uid);
 if(followingIds.has(uid)){
  await remove(r);followingIds.delete(uid);
 }else{
  await set(r,true);followingIds.add(uid);
 }
 if(feedMode==="following")renderFeed(allVideos);
}

async function saveVideo(id){
 if(!currentUser)return alert("Login အရင်ဝင်ပါ");
 const r=ref(db,"savedVideos/"+currentUser.uid+"/"+id);
 if(savedVideoIds.has(id)){
  await remove(r);savedVideoIds.delete(id);
 }else{
  await set(r,true);savedVideoIds.add(id);
 }
 renderFeed(allVideos);
}

async function shareVideo(id){
 const url=location.href.split("#")[0]+"#video-"+id;
 try{
  if(navigator.share)await navigator.share({title:"TMK VIDEO",url});
  else{await navigator.clipboard.writeText(url);alert("Link Copy ပြီးပါပြီ");}
 }catch(e){}
}

async function deleteVideo(id){
 if(!currentUser||!confirm("ဒီ Video ကို ဖျက်မှာ သေချာပါသလား"))return;
 const s=await get(ref(db,"videos/"+id));
 if(!s.exists()||s.val().uid!==currentUser.uid)return alert("ကိုယ့် Video ကိုသာ ဖျက်နိုင်ပါတယ်");
 await remove(ref(db,"videos/"+id));
}

function openComments(id){
 selectedCommentVideo=id;
 $("commentPanel").classList.add("open");
 if(commentUnsubscribe)commentUnsubscribe();
 commentUnsubscribe=onValue(ref(db,"comments/"+id),snap=>{
  const comments=[];
  if(snap.exists())snap.forEach(c=>comments.push(c.val()));
  comments.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  $("panelComments").innerHTML=comments.map(c=>
   `<div class="comment-item"><b>${esc((c.uid||"User").slice(0,8))}</b><br>${esc(c.text||"")}</div>`
  ).join("")||"Comment မရှိသေးပါ";
 });
}
$("closeComments").onclick=()=>{
 $("commentPanel").classList.remove("open");
 if(commentUnsubscribe){commentUnsubscribe();commentUnsubscribe=null;}
};
$("panelCommentSend").onclick=async()=>{

/* UPLOAD PERMISSION */
async function getUploadPermission(file){
 if(!currentUser)throw Error("Login အရင်ဝင်ပါ");
 const token=await currentUser.getIdToken();
 const response=await fetch(UPLOAD_FUNCTION_URL,{
  method:"POST",
  headers:{
   Authorization:"Bearer "+token,
   apikey:SUPABASE_PUBLISHABLE_KEY,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({
   filename:file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),
   contentType:file.type
  })
 });
 const result=await response.json();
 if(!response.ok||!result.success)throw Error(result.error||"Upload Permission Error");
 return result;
}

function uploadWithProgress(url,file){
 return new Promise((resolve,reject)=>{
  const xhr=new XMLHttpRequest();
  xhr.open("PUT",url);
  xhr.setRequestHeader("Content-Type",file.type||"application/octet-stream");
  xhr.upload.onprogress=e=>{
   if(e.lengthComputable){
    const pct=Math.round(e.loaded/e.total*100);
    $("fileProgressBar").style.width=pct+"%";
    $("fileStatus").textContent="Uploading "+pct+"%";
   }
  };
  xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(Error("Storage Error "+xhr.status+": "+xhr.responseText));
  xhr.onerror=()=>reject(Error("Network Error"));
  xhr.send(file);
 });
}

async function workerPost(path,body){
 const token=await currentUser.getIdToken();
 const response=await fetch(WORKER_URL+path,{
  method:"POST",
  headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},
  body:JSON.stringify(body)
 });
 const result=await response.json();
 if(!response.ok||!result.success)throw Error(result.message||result.error||"Worker API Error");
 return result;
}
async function sha1Hex(blob){
 const hash=await crypto.subtle.digest("SHA-1",await blob.arrayBuffer());
 return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function uploadB2Part(url,token,number,sha1,blob,onProgress){
 return new Promise((resolve,reject)=>{
  const xhr=new XMLHttpRequest();
  xhr.open("POST",url);
  xhr.setRequestHeader("Authorization",token);
  xhr.setRequestHeader("X-Bz-Part-Number",String(number));
  xhr.setRequestHeader("X-Bz-Content-Sha1",sha1);
  xhr.setRequestHeader("Content-Type","application/octet-stream");
  xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded);};
  xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(Error("B2 Part Error "+xhr.status+": "+xhr.responseText));
  xhr.onerror=()=>reject(Error("B2 Network Error"));
  xhr.send(blob);
 });
}
async function uploadLargeVideoToB2(file,title,caption){
 $("fileStatus").textContent="B2 Upload စတင်နေပါတယ်...";
 const init=await workerPost("/upload/init",{size:file.size,contentType:file.type});
 const partSha1Array=[];
 let uploaded=0;

 for(let i=0;i<init.partCount;i++){
  const number=i+1;
  const chunk=file.slice(i*init.partSize,Math.min((i+1)*init.partSize,file.size));
  $("fileStatus").textContent="Part "+number+"/"+init.partCount;
  const sha1=await sha1Hex(chunk);
  const part=await workerPost("/upload/part-url",{fileId:init.fileId,partNumber:number});
  await uploadB2Part(part.uploadUrl,part.authorizationToken,number,sha1,chunk,loaded=>{
   $("fileProgressBar").style.width=Math.round(Math.min(uploaded+loaded,file.size)/file.size*100)+"%";
  });
  uploaded+=chunk.size;
  partSha1Array.push(sha1);
 }
 const finished=await workerPost("/upload/finish",{fileId:init.fileId,partSha1Array});
 await push(ref(db,"videos"),{
  title:(title||file.name).slice(0,100),
  caption:(caption||"").slice(0,500),
  videoUrl:finished.videoUrl,
  storagePath:finished.fileName,
  storageProvider:"Backblaze B2",
  uid:currentUser.uid,
  username:$("profileName").textContent||"User",
  createdAt:Date.now()
 });
 $("fileProgressBar").style.width="100%";
 $("fileStatus").textContent="Upload Complete!";
}

async function uploadVideoFile(file,title,caption){
 if(!currentUser)throw Error("Login အရင်ဝင်ပါ");
 if(!file)throw Error("Video ရွေးပါ");
 if(!["video/mp4","video/webm","video/quicktime"].includes(file.type))throw Error("MP4, WebM, MOV သာတင်နိုင်ပါတယ်");
 $("fileProgressBar").style.width="0%";

 if(file.size>50*1024*1024){
  return uploadLargeVideoToB2(file,title,caption);
 }

 $("fileStatus").textContent="Supabase Permission တောင်းနေပါတယ်...";
 const p=await getUploadPermission(file);
 if(!p.path||!p.token||!p.publicUrl)throw Error("Supabase Upload Permission မပြည့်စုံပါ");

 const path=p.path.split("/").map(encodeURIComponent).join("/");
 const url=SUPABASE_URL+"/storage/v1/object/upload/sign/"+
  encodeURIComponent(BUCKET_NAME)+"/"+path+
  "?token="+encodeURIComponent(p.token);
 await uploadWithProgress(url,file);

 await push(ref(db,"videos"),{
  title:(title||file.name).slice(0,100),
  caption:(caption||"").slice(0,500),
  videoUrl:p.publicUrl,
  storagePath:p.path,
  storageProvider:"Supabase",
  uid:currentUser.uid,
  username:$("profileName").textContent||"User",
  createdAt:Date.now()
 });
 $("fileProgressBar").style.width="100%";
 $("fileStatus").textContent="Upload Complete!";
}
