
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#08080d">
<title>TMK VIDEO</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:#08080d;color:white;
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* HEADER */
header{
  position:sticky;top:0;z-index:20;
  height:58px;background:#101018;
  display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;
  border-bottom:1px solid #292936;
}
.logo{font-size:23px;font-weight:900;color:#00e5ff}
.header-search{
  width:42px;height:38px;border:0;border-radius:50%;
  background:#252535;color:white;font-size:19px;
}

/* PAGE */
.page{display:none;padding-bottom:80px}
.page.active{display:block}
.page-title{padding:18px 16px 8px;font-size:21px}
.muted{color:#aaa}

/* VIDEO FEED */
.feed{
  width:100%;max-width:650px;margin:auto;
}
.video-card{
  position:relative;width:100%;
  min-height:calc(100svh - 140px);
  height:calc(100svh - 140px);
  background:#15151e;
  margin-bottom:12px;overflow:hidden;
  border-radius:12px;
  scroll-snap-align:start;
}
.video-card iframe{
  width:100%;height:100%;border:0;
  background:#000;
}
.video-overlay{
  position:absolute;left:0;right:0;bottom:0;
  padding:65px 80px 18px 15px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
  pointer-events:none;
}
.video-title{
  font-size:17px;font-weight:bold;
  margin-bottom:7px;overflow-wrap:anywhere;
}
.video-owner{font-size:13px;color:#ddd}
.video-actions{
  position:absolute;right:10px;bottom:25px;
  display:flex;flex-direction:column;
  align-items:center;gap:17px;
}
.action-btn{
  border:0;background:rgba(0,0,0,.5);
  color:white;width:48px;height:48px;
  border-radius:50%;font-size:23px;
}
.action-btn.liked{color:#ff315b}
.action-label{font-size:11px;text-align:center}
.video-delete{
  background:#ed3434;color:white;border:0;
  padding:7px 10px;border-radius:7px;font-size:12px;
}

/* EMPTY */
.empty{
  padding:45px 20px;text-align:center;
  color:#aaa;line-height:1.8;
}

/* SEARCH */
.search-box{
  margin:12px 15px;display:flex;gap:8px;
}
.search-box input{flex:1}
input{
  width:100%;padding:13px;margin:7px 0;
  border-radius:9px;border:1px solid #393948;
  background:#191923;color:white;outline:none;
}
input:focus{border-color:#00d9ee}
input[type=file]{background:#191923}
.primary-btn{
  border:0;background:#00d9ee;color:#08080d;
  padding:12px 17px;border-radius:9px;
  font-weight:bold;
}
.danger-btn{background:#ed3434;color:white}
.card{
  background:#171721;border:1px solid #292936;
  border-radius:13px;padding:16px;margin:12px;
}
.card h3{margin-top:0}
#message,#profileMessage{
  color:#00e5ff;padding:8px 0;
  overflow-wrap:anywhere;
}

/* PROFILE */
.profile-box{text-align:center;padding:20px 10px}
.profile-photo{
  width:115px;height:115px;border-radius:50%;
  object-fit:cover;border:3px solid #00e5ff;
  background:#333;
}
.profile-name{font-size:22px;color:#00e5ff}
.profile-email{color:#aaa;overflow-wrap:anywhere}
.stats{
  display:flex;justify-content:center;gap:35px;
  margin:20px 0;padding:16px;
  background:#22222f;border-radius:12px;
}
.stats strong{display:block;font-size:23px;color:#00e5ff}
.stats span{font-size:12px;color:#aaa}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  z-index:30;height:65px;
  display:flex;justify-content:space-around;
  align-items:center;background:#111119;
  border-top:1px solid #30303a;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  border:0;background:none;color:#aaa;
  display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:11px;
  min-width:55px;
}
.nav-btn .nav-icon{font-size:22px}
.nav-btn.active{color:#00e5ff}
.upload-nav{
  background:#00d9ee;color:#08080d;
  width:43px;height:31px;border-radius:9px;
  font-size:25px;font-weight:bold;
  line-height:28px;
}

/* RESPONSIVE */
@media(min-width:700px){
  .video-card{height:650px;min-height:500px}
  .feed{padding:12px}
  .page{padding-bottom:90px}
}
footer{text-align:center;color:#777;padding:20px}
</style>
</head>

<body>

<header>
  <div class="logo">TMK VIDEO</div>
  <button class="header-search" id="searchHeader">⌕</button>
</header>

<!-- HOME FEED -->
<section id="homePage" class="page active">
  <div class="feed" id="videoFeed"></div>
</section>

<!-- DISCOVER -->
<section id="discoverPage" class="page">
  <h2 class="page-title">🔎 Discover</h2>
  <div class="search-box">
    <input id="searchInput" placeholder="Video အမည် ရှာပါ...">
  </div>
  <div id="searchResults"></div>
</section>

<!-- UPLOAD -->
<section id="uploadPage" class="page">
  <h2 class="page-title">🎥 Video တင်ရန်</h2>
  <div class="card">
    <h3>Upload YouTube Video</h3>
    <p class="muted">YouTube Video Link ကို ထည့်ပေးပါ။</p>
    <input id="videoTitle" placeholder="ဗီဒီယိုအမည်">
    <input id="videoLink" placeholder="YouTube Video Link">
    <button class="primary-btn" id="addVideoBtn">＋ Video တင်မည်</button>
    <p id="uploadMessage"></p>
  </div>
</section>

<!-- PROFILE / ACCOUNT -->
<section id="profilePage" class="page">
  <h2 class="page-title">👤 My Profile</h2>

  <div id="authBox" class="card">
    <h3>Login / Register</h3>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button class="primary-btn" id="registerBtn">Register</button>
    <button class="primary-btn" id="loginBtn">Login</button>
    <p id="message">Not logged in</p>
  </div>

  <div id="profileBox" class="card hidden">
    <div class="profile-box">
      <img id="profilePhoto" class="profile-photo"
        src="https://placehold.co/200x200/252535/00e5ff?text=TMK"
        alt="Profile">
      <h3 id="displayName" class="profile-name">TMK User</h3>
      <p id="displayEmail" class="profile-email"></p>

      <div class="stats">
        <div><strong id="videoCount">0</strong><span>My Videos</span></div>
      </div>
    </div>

    <h3>Change Profile</h3>
    <label>Profile ဓာတ်ပုံ</label>
    <input type="file" id="profilePhotoInput" accept="image/*">
    <input id="usernameInput" maxlength="30"
      placeholder="Username အသစ်">
    <button class="primary-btn" id="saveProfileBtn">Save Profile</button>
    <p id="profileMessage"></p>
    <button class="primary-btn danger-btn" id="logoutBtn"
      style="width:100%">Logout</button>
  </div>

  <div class="card">
    <h3>About TMK VIDEO</h3>
    <p class="muted">Welcome to TMK Official Video Platform.</p>
    <p class="muted">© 2026 TMK VIDEO</p>
  </div>
</section>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-page="homePage">
    <span class="nav-icon">⌂</span>Home
  </button>
  <button class="nav-btn" data-page="discoverPage">
    <span class="nav-icon">⌕</span>Discover
  </button>
  <button class="nav-btn" data-page="uploadPage">
    <span class="upload-nav">＋</span>Upload
  </button>
  <button class="nav-btn" data-page="profilePage">
    <span class="nav-icon">♙</span>Profile
  </button>
</nav>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,createUserWithEmailAndPassword,
  signInWithEmailAndPassword,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getDatabase,ref,push,set,onValue,off,remove
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAQxjXOcFEBRv-yrFsxU1Z7tSLjT74UC_M",
  authDomain: "tmk-video.firebaseapp.com",
  databaseURL: "https://tmk-video-default-rtdb.firebaseio.com",
  projectId: "tmk-video",
  storageBucket: "tmk-video.firebasestorage.app",
  messagingSenderId: "763253894514",
  appId: "1:763253894514:web:5b671edd58fe2d312381eb",
  measurementId: "G-NZXE0Y822B"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const database=getDatabase(app);
const videosRef=ref(database,"videos");

let savedVideos=[];
let profileData={};
let selectedPhoto=null;
let currentProfileRef=null;
let currentProfileCallback=null;

/* PAGE NAVIGATION */
function showPage(pageId){
  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("active");
  });
  document.getElementById(pageId).classList.add("active");

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===pageId);
  });
  window.scrollTo(0,0);
}

document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    showPage(btn.dataset.page);
  });
});

document.getElementById("searchHeader").onclick=()=>{
  showPage("discoverPage");
  document.getElementById("searchInput").focus();
};

/* AUTH */
document.getElementById("registerBtn").onclick=async()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const message=document.getElementById("message");

  if(!email||!password){
    message.textContent="Email နဲ့ Password ထည့်ပါ။";
    return;
  }
  try{
    await createUserWithEmailAndPassword(auth,email,password);
    message.textContent="Register successful!";
  }catch(error){
    message.textContent=error.message;
  }
};

document.getElementById("loginBtn").onclick=async()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const message=document.getElementById("message");

  if(!email||!password){
    message.textContent="Email နဲ့ Password ထည့်ပါ။";
    return;
  }
  try{
    await signInWithEmailAndPassword(auth,email,password);
    message.textContent="Login successful!";
  }catch(error){
    message.textContent=error.message;
  }
};

document.getElementById("logoutBtn").onclick=async()=>{
  try{
    await signOut(auth);
    document.getElementById("message").textContent="Logout successful!";
  }catch(error){
    document.getElementById("profileMessage").textContent=error.message;
  }
};

/* PROFILE */
function renderProfile(user){
  const photo=profileData.photoData||"";
  document.getElementById("profilePhoto").src=
    photo||"https://placehold.co/200x200/252535/00e5ff?text=TMK";

  document.getElementById("displayName").textContent=
    profileData.username||user.email.split("@")[0];

  document.getElementById("displayEmail").textContent=user.email;
  document.getElementById("usernameInput").value=profileData.username||"";

  document.getElementById("videoCount").textContent=
    savedVideos.filter(v=>v.uid===user.uid).length;
}

/* AUTH STATE */
onAuthStateChanged(auth,user=>{
  if(currentProfileRef&&currentProfileCallback){
    off(currentProfileRef,"value",currentProfileCallback);
  }
  currentProfileRef=null;
  currentProfileCallback=null;
  profileData={};

  if(user){
    document.getElementById("authBox").classList.add("hidden");
    document.getElementById("profileBox").classList.remove("hidden");

    currentProfileRef=ref(database,"users/"+user.uid);
    currentProfileCallback=snapshot=>{
      profileData=snapshot.val()||{};
      renderProfile(user);
    };
    onValue(currentProfileRef,currentProfileCallback,error=>{
      document.getElementById("profileMessage").textContent=
        "Profile error: "+error.message;
    });
  }else{
    document.getElementById("authBox").classList.remove("hidden");
    document.getElementById("profileBox").classList.add("hidden");
    document.getElementById("message").textContent="Not logged in";
  }
  renderVideos();
});

/* PHOTO SELECT */
document.getElementById("profilePhotoInput").onchange=async event=>{
  const file=event.target.files[0];
  if(!file)return;

  if(!file.type.startsWith("image/")){
    alert("ဓာတ်ပုံဖိုင်ကိုသာ ရွေးပါ။");
    event.target.value="";
    return;
  }
  if(file.size>5*1024*1024){
    alert("ဓာတ်ပုံ 5MB ထက် မကြီးရပါ။");
    event.target.value="";
    return;
  }

  const image=new Image();
  const url=URL.createObjectURL(file);
  image.src=url;

  try{
    await new Promise((resolve,reject)=>{
      image.onload=resolve;
      image.onerror=reject;
    });

    const canvas=document.createElement("canvas");
    const scale=Math.min(1,400/Math.max(image.width,image.height));
    canvas.width=Math.round(image.width*scale);
    canvas.height=Math.round(image.height*scale);
    canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);

    selectedPhoto=canvas.toDataURL("image/jpeg",0.65);
    document.getElementById("profilePhoto").src=selectedPhoto;
    document.getElementById("profileMessage").textContent=
      "ဓာတ်ပုံရွေးပြီးပါပြီ။ Save Profile နှိပ်ပါ။";
  }catch(error){
    alert("ဓာတ်ပုံဖတ်မရပါ။");
  }finally{
    URL.revokeObjectURL(url);
  }
};

/* SAVE PROFILE */
document.getElementById("saveProfileBtn").onclick=async()=>{
  const user=auth.currentUser;
  if(!user){
    alert("Login အရင်ဝင်ပါ။");
    return;
  }

  const username=document.getElementById("usernameInput").value.trim();
  const msg=document.getElementById("profileMessage");

  if(!username){
    msg.textContent="Username ထည့်ပေးပါ။";
    return;
  }
  if(username.length>30){
    msg.textContent="Username အရှည်ဆုံး 30 လုံးသာ ရပါမယ်။";
    return;
  }

  const photoData=selectedPhoto!==null?
    selectedPhoto:(profileData.photoData||"");

  if(photoData.length>350000){
    msg.textContent="ဓာတ်ပုံအရွယ်အစား ကြီးနေပါတယ်။";
    return;
  }

  try{
    msg.textContent="Saving...";
    await set(ref(database,"users/"+user.uid),{
      username:username,
      photoData:photoData,
      updatedAt:Date.now()
    });
    selectedPhoto=null;
    document.getElementById("profilePhotoInput").value="";
    msg.textContent="Profile သိမ်းဆည်းပြီးပါပြီ။";
  }catch(error){
    msg.textContent="သိမ်းမရပါ: "+error.message;
  }
};

/* LIKE STORAGE - THIS DEVICE ONLY */
function getLikes(){
  try{return JSON.parse(localStorage.getItem("tmkLikes")||"{}");}
  catch(e){return {};}
}
function saveLike(id,liked){
  const likes=getLikes();
  likes[id]=liked;
  localStorage.setItem("tmkLikes",JSON.stringify(likes));
}

/* VIDEO FEED */
function renderVideos(){
  const feed=document.getElementById("videoFeed");
  feed.innerHTML="";

  if(savedVideos.length===0){
    feed.innerHTML=`
      <div class="empty">
        <h2>🎬 TMK VIDEO</h2>
        <p>ဗီဒီယို မရှိသေးပါ။</p>
        <p>Upload ကိုနှိပ်ပြီး Video တင်နိုင်ပါတယ်။</p>
      </div>`;
  }

  savedVideos.forEach(video=>{
    const card=document.createElement("article");
    card.className="video-card";

    const iframe=document.createElement("iframe");
    iframe.src="https://www.youtube.com/embed/"+
      encodeURIComponent(video.youtubeId)+
      "?playsinline=1&rel=0";
    iframe.title=video.title||"TMK Video";
    iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    iframe.allowFullscreen=true;

    const overlay=document.createElement("div");
    overlay.className="video-overlay";

    const title=document.createElement("div");
    title.className="video-title";
    title.textContent=video.title||"TMK Video";

    const owner=document.createElement("div");
    owner.className="video-owner";
    owner.textContent="@"+(video.username||"TMK User");

    overlay.append(title,owner);

    const actions=document.createElement("div");
    actions.className="video-actions";

    const liked=!!getLikes()[video.id];

    const likeWrap=document.createElement("div");
    const likeBtn=document.createElement("button");
    likeBtn.className="action-btn"+(liked?" liked":"");
    likeBtn.textContent="♥";
    const likeLabel=document.createElement("div");
    likeLabel.className="action-label";
    likeLabel.textContent=liked?"Liked":"Like";

    likeBtn.onclick=()=>{
      const next=!getLikes()[video.id];
      saveLike(video.id,next);
      likeBtn.classList.toggle("liked",next);
      likeLabel.textContent=next?"Liked":"Like";
    };
    likeWrap.append(likeBtn,likeLabel);

    const commentWrap=document.createElement("div");
    const commentBtn=document.createElement("button");
    commentBtn.className="action-btn";
    commentBtn.textContent="💬";
    const commentLabel=document.createElement("div");
    commentLabel.className="action-label";
    commentLabel.textContent="Comment";
    commentBtn.onclick=()=>{
      window.open(
        "https://www.youtube.com/watch?v="+encodeURIComponent(video.youtubeId),
        "_blank"
      );
    };
    commentWrap.append(commentBtn,commentLabel);

    const shareWrap=document.createElement("div");
    const shareBtn=document.createElement("button");
    shareBtn.className="action-btn";
    shareBtn.textContent="↗";
    const shareLabel=document.createElement("div");
    shareLabel.className="action-label";
    shareLabel.textContent="Share";
    shareBtn.onclick=async()=>{
      const url="https://www.youtube.com/watch?v="+video.youtubeId;
      try{
        if(navigator.share){
          await navigator.share({title:video.title,url:url});
        }else if(navigator.clipboard){
          await navigator.clipboard.writeText(url);
          alert("Video Link Copy လုပ်ပြီးပါပြီ။");
        }else{
          prompt("Video Link",url);
        }
      }catch(error){}
    };
    shareWrap.append(shareBtn,shareLabel);

    actions.append(likeWrap,commentWrap,shareWrap);

    card.append(iframe,overlay,actions);

    if(auth.currentUser&&auth.currentUser.uid===video.uid){
      const del=document.createElement("button");
      del.className="video-delete";
      del.textContent="Delete";
      del.style.position="absolute";
      del.style.top="12px";
      del.style.left="12px";
      del.onclick=async()=>{
        if(!confirm("ဒီ Video ကို ဖျက်မှာ သေချာပါသလား။"))return;
        try{
          await remove(ref(database,"videos/"+video.id));
        }catch(error){
          alert("ဖျက်မရပါ: "+error.message);
        }
      };
      card.appendChild(del);
    }
    feed.appendChild(card);
  });

  if(auth.currentUser)renderProfile(auth.currentUser);
}

/* LOAD VIDEOS */
onValue(videosRef,snapshot=>{
  savedVideos=[];
  snapshot.forEach(child=>{
    savedVideos.push({id:child.key,...child.val()});
  });
  savedVideos.reverse();
  renderVideos();
},error=>{
  document.getElementById("message").textContent=
    "Video loading error: "+error.message;
});

/* YOUTUBE LINK */
function extractYouTubeId(link){
  try{
    const url=new URL(link);
    let id="";
    if(url.hostname==="youtu.be"){
      id=url.pathname.split("/").filter(Boolean)[0]||"";
    }else if(
      url.hostname==="youtube.com"||
      url.hostname.endsWith(".youtube.com")||
      url.hostname==="youtube-nocookie.com"||
      url.hostname.endsWith(".youtube-nocookie.com")
    ){
      id=url.searchParams.get("v")||
        url.pathname.split("/").filter(Boolean).pop()||"";
    }
    return /^[A-Za-z0-9_-]{11}$/.test(id)?id:"";
  }catch(error){
    return "";
  }
}

/* ADD VIDEO */
document.getElementById("addVideoBtn").onclick=async()=>{
  const title=document.getElementById("videoTitle").value.trim();
  const link=document.getElementById("videoLink").value.trim();
  const videoId=extractYouTubeId(link);
  const msg=document.getElementById("uploadMessage");

  if(!auth.currentUser){
    msg.textContent="Video တင်ရန် Login ဝင်ပါ။";
    return;
  }
  if(!title||!videoId){
    msg.textContent="Video အမည်နဲ့ YouTube Link မှန်မှန်ထည့်ပါ။";
    return;
  }

  try{
    msg.textContent="Video သိမ်းဆည်းနေပါတယ်...";
    await push(videosRef,{
      title:title,
      youtubeId:videoId,
      uid:auth.currentUser.uid,
      createdAt:Date.now()
    });
    document.getElementById("videoTitle").value="";
    document.getElementById("videoLink").value="";
    msg.textContent="Video တင်ပြီးပါပြီ။";
    showPage("homePage");
  }catch(error){
    msg.textContent="Video သိမ်းမရပါ: "+error.message;
  }
};

/* SEARCH */
document.getElementById("searchInput").addEventListener("input",event=>{
  const term=event.target.value.trim().toLowerCase();
  const results=document.getElementById("searchResults");
  results.innerHTML="";

  const matches=savedVideos.filter(video=>
    (video.title||"").toLowerCase().includes(term)
  );

  if(!term)return;

  if(matches.length===0){
    results.innerHTML='<div class="empty">ရှာမတွေ့ပါ။</div>';
    return;
  }

  matches.forEach(video=>{
    const card=document.createElement("div");
    card.className="card";

    const title=document.createElement("h3");
    title.textContent=video.title;

    const watch=document.createElement("button");
    watch.className="primary-btn";
    watch.textContent="Watch Video";
    watch.onclick=()=>{
      showPage("homePage");
      const index=savedVideos.findIndex(v=>v.id===video.id);
      const cards=document.querySelectorAll(".video-card");
      if(cards[index])cards[index].scrollIntoView({behavior:"smooth"});
    };

    card.append(title,watch);
    results.appendChild(card);
  });
});

console.log("TMK VIDEO Ready!");
</script>
