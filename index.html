function escapeHTML(value=""){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function setProgress(prefix,value,status){
  $(prefix+"ProgressBar").style.width=value+"%";
  $(prefix+"Percent").textContent=value+"%";
  if(status)$(prefix+"Status").textContent=status;
}

function safeFileName(name){

    await loadProfile();
  }catch(e){$("profileStatus").textContent=e.message;}
};

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      const scale=Math.min(400/img.width,400/img.height,1);
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg",0.7));
    };
    img.onerror=reject;
    img.src=url;
  });
}

/* VIDEO FEED */
function loadVideos(){
  onValue(videosRef,snap=>{
    allVideos=[];
    if(snap.exists()){
      snap.forEach(child=>{
        allVideos.push({id:child.key,...child.val()});
      });
    }
    allVideos.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    renderVideos(allVideos,"feed");
    updateVideoCount();
  },error=>console.error(error));
}

function renderVideos(videos,targetId){
  const target=$(targetId);
  if(!videos.length){
    target.innerHTML='<div class="card">Video မရှိသေးပါ။</div>';
    return;
  }

  target.innerHTML=videos.map(v=>{
    const isYouTube=!!v.youtubeId;
    const media=isYouTube
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.youtubeId)}" allowfullscreen loading="lazy"></iframe>`
      : `<video src="${escapeHTML(v.videoUrl||"")}" controls playsinline preload="metadata"></video>`;

    return `
      <article class="video-card">
        ${media}
        <div class="video-info">
          <strong>${escapeHTML(v.title||"TMK Video")}</strong>
          <p>${escapeHTML(v.caption||"")}</p>
          <p class="muted">@${escapeHTML(v.username||"User")}</p>
          <button data-like="${escapeHTML(v.id)}">❤️ Like</button>
          ${v.uid===currentUser?.uid?`<button class="danger" data-delete="${escapeHTML(v.id)}">Delete</button>`:""}
        </div>
      </article>`;
  }).join("");

  target.querySelectorAll("[data-like]").forEach(btn=>{
    btn.onclick=()=>likeVideo(btn.dataset.like);
  });
  target.querySelectorAll("[data-delete]").forEach(btn=>{
    btn.onclick=()=>deleteVideo(btn.dataset.delete);
  });
}

/* SUPABASE SIGNED UPLOAD PERMISSION */
async function getUploadPermission(file){
  const token=await currentUser.getIdToken();
  const response=await fetch(UPLOAD_FUNCTION_URL,{
    method:"POST",
    headers:{
      "Authorization":"Bearer "+token,
      "apikey":SUPABASE_PUBLISHABLE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      filename:safeFileName(file.name),
      contentType:file.type
    })
  });

  const result=await response.json();
  if(!response.ok||!result.success){
    throw new Error(result.error||"Upload permission မရပါ");
  }
  return result;
}

/* XHR UPLOAD - REAL PROGRESS */
function uploadWithProgress(url,token,file,prefix){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open("PUT",url);
    xhr.setRequestHeader("apikey",SUPABASE_PUBLISHABLE_KEY);
    xhr.setRequestHeader("Content-Type",file.type||"application/octet-stream");

    xhr.upload.onprogress=e=>{
      if(e.lengthComputable){
        const percent=Math.round(e.loaded/e.total*100);
        setProgress(prefix,percent,"Uploading...");
      }
    };
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300){
        setProgress(prefix,100,"Upload ပြီးပါပြီ။");
        resolve();
      }else{
        reject(new Error("Storage upload error: "+xhr.responseText));
      }
    };
    xhr.onerror=()=>reject(new Error("Network error"));
    xhr.onabort=()=>reject(new Error("Upload ရပ်သွားပါတယ်"));
    xhr.send(file);
  });
}

async function uploadVideoFile(file,title,caption,prefix){
  if(!currentUser)throw new Error("Login အရင်ဝင်ပါ");
  if(!file)throw new Error("Video ရွေးချယ်ပါ");
  if(file.size>50*1024*1024)throw new Error("Video အရွယ်အစား 50MB ထက်မကျော်ရပါ");
  if(!["video/mp4","video/webm","video/quicktime"].includes(file.type)){
    throw new Error("MP4, WebM, MOV Video များသာ တင်နိုင်ပါတယ်");
  }

  setProgress(prefix,0,"Upload permission တောင်းနေပါတယ်...");
  const permission=await getUploadPermission(file);

  if(!permission.path||!permission.token||!permission.publicUrl){
    throw new Error("Supabase upload permission အချက်အလက် မပြည့်စုံပါ");
  }

  const encodedPath=permission.path.split("/").map(encodeURIComponent).join("/");
  const uploadUrl=SUPABASE_URL+
    "/storage/v1/object/upload/sign/"+
    encodeURIComponent(BUCKET_NAME)+"/"+encodedPath+
    "?token="+encodeURIComponent(permission.token);

  setProgress(prefix,0,"Video Upload လုပ်နေပါတယ်...");
  await uploadWithProgress(uploadUrl,permission.token,file,prefix);

  setProgress(prefix,100,"Video အချက်အလက် သိမ်းနေပါတယ်...");
  const videoData={
    title:(title||file.name||"TMK Video").slice(0,100),
    caption:(caption||"").slice(0,500),
    videoUrl:permission.publicUrl,
    storagePath:permission.path,
    uid:currentUser.uid,
    username:(profileData.username||currentUser.email.split("@")[0]).slice(0,30),
    createdAt:Date.now()
  };

  await push(videosRef,videoData);
  setProgress(prefix,100,"Upload Complete!");
}

let tmkChunks=[];
let tmkFacing="user";
let tmkRecordedBlob=null;
let tmkCanvasStream=null;
let tmkAnimation=null;
let tmkRecording=false;
let tmkPreviewUrl=null;

  tmkFacing=tmkFacing==="user"?"environment":"user";

async function tmkStartCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Camera အတွက် HTTPS Website ဖြင့် ဖွင့်ပါ");
    }
    if(tmkStream)tmkStream.getTracks().forEach(t=>t.stop());

    tmkStream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:tmkFacing},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:true
    });

    camera.srcObject=tmkStream;
    camera.style.filter=$("tmkEffect").value;
    await camera.play();
    $("cameraStatus").textContent="Camera Ready";
  }catch(e){
    $("cameraStatus").textContent=e.message;
    alert("Camera ဖွင့်မရပါ။ Browser Permission ကို စစ်ပါ။");
  }
}

$("tmkRecord").onclick=tmkStartRecord;
$("tmkStop").onclick=tmkStopRecord;

function tmkStartRecord(){
  if(!tmkStream){alert("Camera အရင်ဖွင့်ပါ");return;}
  if(!window.MediaRecorder){alert("ဒီ Browser မှာ Recording မရပါ");return;}
  if(tmkRecording)return;

  tmkChunks=[];
  tmkRecordedBlob=null;

  const width=camera.videoWidth||720;
  const height=camera.videoHeight||1280;
  const canvas=document.createElement("canvas");
  canvas.width=width;
  canvas.height=height;
  const ctx=canvas.getContext("2d");

  tmkRecording=true;

  function drawFrame(){
    if(!tmkRecording)return;
    ctx.save();
    ctx.filter=$("tmkEffect").value;
    ctx.drawImage(camera,0,0,width,height);
    ctx.restore();
    tmkAnimation=requestAnimationFrame(drawFrame);
  }

  drawFrame();
  tmkCanvasStream=canvas.captureStream(30);
  tmkStream.getAudioTracks().forEach(track=>{
    tmkCanvasStream.addTrack(track);
  });

  let options={};
  if(MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")){
    options.mimeType="video/webm;codecs=vp8,opus";
  }else if(MediaRecorder.isTypeSupported("video/webm")){
    options.mimeType="video/webm";
  }

  try{
    tmkRecorder=new MediaRecorder(tmkCanvasStream,options);
  }catch(e){
    tmkRecording=false;
    alert("Recording စတင်မရပါ: "+e.message);
    return;
  }

  tmkRecorder.ondataavailable=e=>{
    if(e.data&&e.data.size>0)tmkChunks.push(e.data);
  };

  tmkRecorder.onstop=()=>{
    tmkRecordedBlob=new Blob(tmkChunks,{
      type:tmkRecorder.mimeType||"video/webm"
    });
    if(tmkPreviewUrl)URL.revokeObjectURL(tmkPreviewUrl);
    tmkPreviewUrl=URL.createObjectURL(tmkRecordedBlob);
    preview.src=tmkPreviewUrl;
    $("cameraStatus").textContent="Video Preview Ready";
    if(tmkCanvasStream){
      tmkCanvasStream.getTracks().forEach(t=>t.stop());
    }
  };

  tmkRecorder.start(1000);
  $("cameraStatus").textContent="🔴 Recording...";
}

function tmkStopRecord(){
  tmkRecording=false;
  if(tmkAnimation)cancelAnimationFrame(tmkAnimation);
  if(tmkRecorder&&tmkRecorder.state==="recording"){
    tmkRecorder.stop();
  }
}

$("tmkCameraUpload").onclick=async()=>{
  if(!tmkRecordedBlob){
    alert("Video အရင်ရိုက်ပြီး Stop နှိပ်ပါ");
    return;
  }
  $("tmkCameraUpload").disabled=true;
  try{
    const file=new File(
      [tmkRecordedBlob],
      "tmk-camera-"+Date.now()+".webm",
      {type:"video/webm"}
    );
    await uploadVideoFile(
      file,
      $("cameraTitle").value.trim()||file.name,
      $("cameraCaption").value.trim(),
      "camera"
    );
    alert("Camera Video တင်ပြီးပါပြီ ❤️");
    tmkRecordedBlob=null;
    preview.removeAttribute("src");
    preview.load();
    $("cameraTitle").value="";
    $("cameraCaption").value="";
    showPage("homePage");
  }catch(e){
    console.error(e);
    $("cameraStatus").textContent="Upload Error: "+e.message;
    alert("Upload မအောင်မြင်ပါ: "+e.message);
  }finally{$("tmkCameraUpload").disabled=false;}
};

/* CLEAN UP CAMERA WHEN PAGE IS CLOSED */
window.addEventListener("pagehide",()=>{
  if(tmkRecording)tmkStopRecord();
  if(tmkStream)tmkStream.getTracks().forEach(t=>t.stop());
});

console.log("TMK VIDEO ready");
</script>
