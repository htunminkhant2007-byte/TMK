
name: Build TMK VIDEO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK Platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Python Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Locate TMK project files
        shell: bash
        run: |
          echo "Searching repository..."

          echo "Repository structure:"
          find . -maxdepth 5 -type f \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            | sort

          INDEX_FILE=$(find . -maxdepth 6 -type f \
            -name index.html \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./android/*" \
            -not -path "./www/*" \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          WEB_DIR="${INDEX_FILE%/*}"

          if [ "$WEB_DIR" = "$INDEX_FILE" ]; then
            WEB_DIR="."
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"
          echo "Website found: $INDEX_FILE"

          LOGO_FILE=$(find . -maxdepth 6 -type f \
            -name tmk-video-icon-512.png \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./android/*" \
            | head -n 1)

          if [ -z "$LOGO_FILE" ]; then
            echo "ERROR: tmk-video-icon-512.png not found"
            exit 1
          fi

          echo "LOGO_FILE=$LOGO_FILE" >> "$GITHUB_ENV"
          echo "Logo found: $LOGO_FILE"

          for FILE in manifest.json sw.js; do
            if [ ! -f "$WEB_DIR/$FILE" ]; then
              echo "ERROR: $FILE not found in $WEB_DIR"
              exit 1
            fi
          done

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found in repository root"
            exit 1
          fi

          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then
            echo "ERROR: Capacitor configuration not found"
            exit 1
          fi

          echo "All project files checked successfully!"

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Prepare web files
        run: |
          mkdir -p www

          cp "$WEB_DIR/index.html" www/index.html
          cp "$WEB_DIR/manifest.json" www/manifest.json
          cp "$WEB_DIR/sw.js" www/sw.js

          if [ -f "$WEB_DIR/icon.svg" ]; then
            cp "$WEB_DIR/icon.svg" www/icon.svg
          fi

          echo "Web files prepared successfully!"

      - name: Configure Capacitor
        run: |
          node - <<'JS'
          const fs = require("fs");

          const path = "capacitor.config.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));

          config.appId = config.appId || "com.tmk.video";
          config.appName = "TMK VIDEO";
          config.webDir = "www";

          fs.writeFileSync(
            path,
            JSON.stringify(config, null, 2)
          );

          console.log("Capacitor configuration checked.");
          JS

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync Android project
        run: |
          npx cap sync android

      - name: Generate TMK App Icons
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          source = Path(os.environ["LOGO_FILE"])

          if not source.is_file():
              raise SystemExit("TMK logo file missing!")

          original = Image.open(source).convert("RGBA")
          original = original.resize(
              (512, 512),
              Image.Resampling.LANCZOS
          )

          res = Path("android/app/src/main/res")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              directory = res / folder
              directory.mkdir(parents=True, exist_ok=True)

              icon = original.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(directory / "ic_launcher.png")
              icon.save(directory / "ic_launcher_round.png")

          foreground_dir = res / "drawable-nodpi"
          foreground_dir.mkdir(parents=True, exist_ok=True)

          foreground = Image.new(
              "RGBA",
              (432, 432),
              (0, 0, 0, 0)
          )

          logo = original.resize(
              (346, 346),
              Image.Resampling.LANCZOS
          )

          foreground.alpha_composite(
              logo,
              (43, 43)
          )

          foreground.save(
              foreground_dir / "ic_launcher_foreground.png"
          )

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)

          (values / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="ic_launcher_background">#07070A</color>\n'
              '</resources>\n',
              encoding="utf-8"
          )

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)

          xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background"/>\n'
              '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )

          (adaptive / "ic_launcher.xml").write_text(
              xml,
              encoding="utf-8"
          )

          (adaptive / "ic_launcher_round.xml").write_text(
              xml,
              encoding="utf-8"
          )

          original.resize((192, 192)).save(
              "www/launchericon-192x192.png"
          )

          original.resize((512, 512)).save(
              "www/launchericon-512x512.png"
          )

          print("TMK VIDEO icons generated successfully!")
          PY

      - name: Verify Android icons
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

          echo "All Android icons verified!"

      - name: Build TMK VIDEO APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi

          ls -lh "$APK"
          echo "TMK VIDEO APK build successful!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TMK-VIDEO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
