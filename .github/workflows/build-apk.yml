
name: Build TMK VIDEO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      # 6. Install Android platform
      - name: Install Android SDK Platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # 7. Install project dependencies
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          python -m pip install --upgrade Pillow

      # 8. Find website and logo files
      - name: Find TMK project files
        shell: bash
        run: |
          echo "Searching for index.html..."

          INDEX_FILE=$(find . -maxdepth 6 -type f \
            -name "index.html" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./android/*" \
            -not -path "./www/*" \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found!"
            echo "Repository files:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          WEB_SOURCE="${INDEX_FILE%/index.html}"

          echo "Website folder: $WEB_SOURCE"
          echo "WEB_SOURCE=$WEB_SOURCE" >> "$GITHUB_ENV"

          LOGO_FILE=$(find . -maxdepth 6 -type f \
            -name "tmk-video-icon-512.png" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./android/*" \
            | head -n 1)

          if [ -z "$LOGO_FILE" ]; then
            echo "ERROR: TMK logo PNG not found!"
            echo "Please check tmk-video-icon-512.png"
            exit 1
          fi

          echo "Logo found: $LOGO_FILE"
          echo "LOGO_FILE=$LOGO_FILE" >> "$GITHUB_ENV"

          test -f "$WEB_SOURCE/manifest.json" || {
            echo "ERROR: manifest.json missing!"
            exit 1
          }

          test -f "$WEB_SOURCE/sw.js" || {
            echo "ERROR: sw.js missing!"
            exit 1
          }

          test -f package.json || {
            echo "ERROR: package.json missing!"
            exit 1
          }

          test -f capacitor.config.json || {
            echo "ERROR: capacitor.config.json missing!"
            exit 1
          }

          echo "All required project files found!"

      # 9. Prepare website files
      - name: Prepare web files
        shell: bash
        run: |
          mkdir -p www

          cp "$WEB_SOURCE/index.html" www/
          cp "$WEB_SOURCE/manifest.json" www/
          cp "$WEB_SOURCE/sw.js" www/

          if [ -f "$WEB_SOURCE/icon.svg" ]; then
            cp "$WEB_SOURCE/icon.svg" www/
          fi

          if [ -f "$WEB_SOURCE/launchericon-192x192.png" ]; then
            cp "$WEB_SOURCE/launchericon-192x192.png" www/
          fi

          if [ -f "$WEB_SOURCE/launchericon-512x512.png" ]; then
            cp "$WEB_SOURCE/launchericon-512x512.png" www/
          fi

          echo "Website files prepared!"

      # 10. Create Android project
      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android project already exists."
          fi

      # 11. Sync Capacitor
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # 12. Generate TMK application icons
      - name: Generate TMK Android App Icons
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("LOGO_PLACEHOLDER")

          if not source.exists():
              raise SystemExit("ERROR: TMK logo file missing!")

          original = Image.open(source).convert("RGBA")

          if original.size != (512, 512):
              original = original.resize(
                  (512, 512),
                  Image.Resampling.LANCZOS
              )

          res = Path("android/app/src/main/res")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)

              icon = original.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(target / "ic_launcher.png")
              icon.save(target / "ic_launcher_round.png")

          foreground_dir = res / "drawable-nodpi"
          foreground_dir.mkdir(parents=True, exist_ok=True)

          foreground = Image.new(
              "RGBA",
              (432, 432),
              (0, 0, 0, 0)
          )

          logo = original.resize(
              (346, 346),
              Image.Resampling.LANCZOS
          )

          foreground.alpha_composite(
              logo,
              ((432 - 346) // 2, (432 - 346) // 2)
          )

          foreground.save(
              foreground_dir / "ic_launcher_foreground.png"
          )

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)

          (values / "ic_launcher_background.xml").write_text(
              """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#07070A</color>
          </resources>
          """,
              encoding="utf-8"
          )

          adaptive_dir = res / "mipmap-anydpi-v26"
          adaptive_dir.mkdir(parents=True, exist_ok=True)

          adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """

          (adaptive_dir / "ic_launcher.xml").write_text(
              adaptive_xml,
              encoding="utf-8"
          )

          (adaptive_dir / "ic_launcher_round.xml").write_text(
              adaptive_xml,
              encoding="utf-8"
          )

          original.resize(
              (192, 192),
              Image.Resampling.LANCZOS
          ).save("www/launchericon-192x192.png")

          original.resize(
              (512, 512),
              Image.Resampling.LANCZOS
          ).save("www/launchericon-512x512.png")

          print("TMK VIDEO icons generated successfully!")
          PY

      # 13. Verify application icons
      - name: Verify Android icons
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

          echo "All TMK icons verified!"

      # 14. Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # 15. Verify APK
      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "TMK VIDEO APK successfully built!"

      # 16. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TMK-VIDEO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
